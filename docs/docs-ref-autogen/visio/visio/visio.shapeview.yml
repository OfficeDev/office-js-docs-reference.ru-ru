- name: toJSON()
  uid: visio!Visio.ShapeView#toJSON:member(1)
  package: visio!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Visio. Объект ShapeView — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`Visio.Interfaces.ShapeViewData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
