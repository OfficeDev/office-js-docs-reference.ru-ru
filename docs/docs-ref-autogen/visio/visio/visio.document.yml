- name: setActivePage(PageName)
  uid: visio!Visio.Document#setActivePage:member(1)
  package: visio!
  fullName: setActivePage(PageName)
  summary: >-
    Установите активную страницу документа.


    \[[Набор API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setActivePage(PageName: string): void;'
    parameters:
    - id: PageName
      description: Имя страницы
      type: string
    return:
      type: void
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```javascript\nVisio.run(session, function (ctx) {\n    var document = ctx.document;\n    var pageName = \"Page-1\";\n    document.setActivePage(pageName);\n    return ctx.sync();\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
- name: showTaskPane(taskPaneType, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(1)
  package: visio!
  fullName: showTaskPane(taskPaneType, initialProps, show)
  summary: >-
    Показать или скрыть taskPane. Этот процесс будет потребляться приложениями Excel и других сторонних приложений, которые встраив рисунок visio, чтобы показать или скрыть области задач.


    \[[Набор API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneType: Visio.TaskPaneType, initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneType
      description: Тип 1-й группы taskPane. Он может принимать значения из enum TaskPaneType.
      type: <xref uid="visio!Visio.TaskPaneType:enum" />
    - id: initialProps
      description: Необязательный параметр. Это общая структура данных, которая будет заполнена начальными данными, необходимыми для инициализации содержимого taskpane.
      type: any
    - id: show
      description: Необязательный параметр. Если задан ложный, он будет скрывать указанный целевой области.
      type: boolean
    return:
      type: void
      description: ''
