- name: showTaskPane(taskPaneType, initialProps, show)
  uid: visio!Visio.Document#showTaskPane:member(1)
  package: visio!
  fullName: showTaskPane(taskPaneType, initialProps, show)
  summary: >-
    Показать или скрыть taskPane. Этот процесс будет потребляться приложениями Excel и других сторонних приложений, которые встраив рисунок visio, чтобы показать или скрыть области задач.


    \[[Набор API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneType: Visio.TaskPaneType, initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneType
      description: Тип 1-й группы taskPane. Он может принимать значения из enum TaskPaneType
      type: <xref uid="visio!Visio.TaskPaneType:enum" />
    - id: initialProps
      description: Необязательный параметр. Это общая структура данных, которая будет заполнена исходными данными, необходимыми для инициализации содержимого taskpane
      type: any
    - id: show
      description: Необязательный параметр. Если задан ложный, он будет скрывать заданную задачу
      type: boolean
    return:
      type: void
      description: ''
