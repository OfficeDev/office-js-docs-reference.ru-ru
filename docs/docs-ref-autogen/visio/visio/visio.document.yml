    \[[Набор API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'showTaskPane(taskPaneTypeString: "None" | "DataVisualizerProcessMappings" | "DataVisualizerOrgChartMappings", initialProps?: any, show?: boolean): void;'
    parameters:
    - id: taskPaneTypeString
      description: Тип 1-й группы taskPane. Он может принимать значения из enum TaskPaneType
      type: "\"None\" | \"DataVisualizerProcessMappings\" | \"DataVisualizerOrgChartMappings\""
    - id: initialProps
      description: Необязательный параметр. Это общая структура данных, которая будет заполнена исходными данными, необходимыми для инициализации содержимого taskpane
      type: any
    - id: show
      description: Необязательный параметр. Если задан ложный, он будет скрывать заданную задачу
      type: boolean
    return:
      type: void
      description: ''
- name: startDataRefresh()
  uid: visio!Visio.Document#startDataRefresh:member(1)
  package: visio!
  fullName: startDataRefresh()
  summary: >-
    Запускает обновление данных в диаграмме, для всех страниц.


    \[[Набор API: 1.1](/office/dev/add-ins/reference/overview/visio-javascript-reference-overview) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'startDataRefresh(): void;'
    return:
      type: void
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```javascript\nVisio.run(session, function (ctx) {\n    var document = ctx.document;\n    document.startDataRefresh();\n    return ctx.sync();\n}).catch(function(error) {\n    console.log(\"Error: \" + error);\n    if (error instanceof OfficeExtension.Error) {\n        console.log(\"Debug info: \" + JSON.stringify(error.debugInfo));\n    }\n});\n```"
- name: toJSON()
  uid: visio!Visio.Document#toJSON:member(1)
  package: visio!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Visio. Объект document — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`Visio.Interfaces.DocumentData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Visio.Interfaces.DocumentData;'
    return:
      type: <xref uid="visio!Visio.Interfaces.DocumentData:interface" />
      description: ''
