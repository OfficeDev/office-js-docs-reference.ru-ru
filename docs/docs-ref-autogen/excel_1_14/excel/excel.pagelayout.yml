### YamlMime:TSType
name: Excel.PageLayout
uid: excel!Excel.PageLayout:class
package: excel!
fullName: Excel.PageLayout
summary: Представляет параметры макета и печати, которые не зависят от реализации, определенной для принтера. Эти параметры включают поля, ориентацию, нумерацию страницы, строки заголовков и область печати.
remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
