properties:
- name: bold
  uid: word!Word.Font#bold:member
  package: word!
  fullName: bold
  summary: Возвращает или задает значение, указывающее, является ли шрифт полужирным. Задайте значение true, чтобы отформатировать шрифт как полужирный, в противном случае — задайте значение false.
  remarks: >-
    \[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Bold format text

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a range proxy object for the current selection.
        var selection = context.document.getSelection();

        // Queue a command to make the current selection bold.
        selection.font.bold = true;

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The selection is now bold.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'bold: boolean;'
    return:
      type: boolean
- name: color
  uid: word!Word.Font#color:member
  package: word!
  fullName: color
  summary: Возвращает или задает цвет для указанного шрифта. Вы можете предоставить значение в формате "\#RRGGBB" или имени цвета.
  remarks: >-
    \[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Change the font color

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a range proxy object for the current selection.
        var selection = context.document.getSelection();

        // Queue a command to change the font color of the current selection.
        selection.font.color = 'blue';

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The font color of the selection has been changed.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'color: string;'
    return:
      type: string
