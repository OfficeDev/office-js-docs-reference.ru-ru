- name: highlightColor
  uid: word!Word.Font#highlightColor:member
  package: word!
  fullName: highlightColor
  summary: 'Получает или задает цвет выделения. Чтобы установить его, используйте значение либо в формате "\#RRGGBB", либо в имени цвета. Чтобы удалить цвет выделения, установите его на null. Возвращенный цвет выделения может быть в формате "\#RRGGBB", пустой строке для смешанных цветов выделения или null без цвета выделения. *Примечание**: Только цвета подсветки по умолчанию доступны в Office для Windows Desktop. Это "Yellow", "Lime", "Turquoise", "Pink", "Blue", "Red", "DarkBlue", "Teal", "Green", "Purple", "DarkRed", "Olive", "Gray", "LightGray" и "Black". При запуске надстройки Office для Windows Desktop любой другой цвет преобразуется в ближайший цвет при применении к шрифту.'
  remarks: >-
    \[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Highlight selected text

    // Run a batch operation against the Word object model.

    await Word.run(async (context) => {

        // Create a range proxy object for the current selection.
        var selection = context.document.getSelection();

        // Queue a command to highlight the current selection.
        selection.font.highlightColor = '#FFFF00'; // Yellow

        // Synchronize the document state by executing the queued commands,
        // and return a promise to indicate task completion.
        await context.sync();
        console.log('The selection has been highlighted.');
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'highlightColor: string;'
    return:
      type: string
