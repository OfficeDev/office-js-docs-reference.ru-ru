summary: Объект, содержащий результат операции оценки функций
remarks: '\[[Набор API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
properties:
- name: context
  uid: excel!Excel.FunctionResult#context:member
  package: excel!
  fullName: context
  summary: Контекст запроса, связанный с объектом. Это связывает процесс надстройки с процессом Office хост-приложения.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="excel!Excel.RequestContext:class" />
- name: error
  uid: excel!Excel.FunctionResult#error:member
  package: excel!
  fullName: error
  summary: Значение ошибки \# (например, DIV/0), представляющее ошибку. Если строка ошибки не установлена, функция успешно работает, и ее результат будет записан в поле Значение. Ошибка всегда находится в английском языке.
  remarks: '\[[Набор API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly error: string;'
    return:
      type: string
- name: value
  uid: excel!Excel.FunctionResult#value:member
  package: excel!
  fullName: value
  summary: Значение оценки функций. Поле значения будет заполнено только в том случае, если ошибка не произошла (например, свойство Error не установлено).
  remarks: '\[[Набор API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly value: T;'
    return:
      type: T
methods:
- name: load(options)
  uid: excel!Excel.FunctionResult#load:member(1)
  package: excel!
  fullName: load(options)
  summary: Добавляет в очередь команду для загрузки указанных свойств объекта. Перед чтением свойств требуется вызвать метод `context.sync()`.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(options?: Excel.Interfaces.FunctionResultLoadOptions): FunctionResult<T>;'
    parameters:
    - id: options
      description: Предоставляет параметры, для которых необходимо загрузить свойства объекта.
      type: <xref uid="excel!Excel.Interfaces.FunctionResultLoadOptions:interface" />
    return:
      type: <xref uid="excel!Excel.FunctionResult:class" />&lt;T&gt;
      description: ''
- name: load(propertyNames)
  uid: excel!Excel.FunctionResult#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: Добавляет в очередь команду для загрузки указанных свойств объекта. Перед чтением свойств требуется вызвать метод `context.sync()`.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): FunctionResult<T>;'
    parameters:
    - id: propertyNames
      description: Запятая или массив строк, которые указывают свойства для загрузки.
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.FunctionResult:class" />&lt;T&gt;
      description: ''
- name: load(propertyNamesAndPaths)
  uid: excel!Excel.FunctionResult#load:member(3)
  package: excel!
  fullName: load(propertyNamesAndPaths)
  summary: Добавляет в очередь команду для загрузки указанных свойств объекта. Перед чтением свойств требуется вызвать метод `context.sync()`.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: >-
      load(propertyNamesAndPaths?: {
                  select?: string;
                  expand?: string;
              }): FunctionResult<T>;
    parameters:
    - id: propertyNamesAndPaths
      description: '`propertyNamesAndPaths.select` является запятой, которая указывает свойства для загрузки, и является строкой, запятой, которая указывает свойства навигации для `propertyNamesAndPaths.expand` загрузки.'
      type: >-
        {
                    select?: string;
                    expand?: string;
                }
    return:
      type: <xref uid="excel!Excel.FunctionResult:class" />&lt;T&gt;
      description: ''
- name: toJSON()
  uid: excel!Excel.FunctionResult#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) Если исходный объект является объектом API, метод возвращает обычный `FunctionResult<T>` `toJSON` объект JavaScript (введите как `Interfaces.FunctionResultData<T>`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Interfaces.FunctionResultData<T>;'
    return:
      type: <xref uid="excel!Excel.Interfaces.FunctionResultData:interface" />&lt;T&gt;
      description: ''
