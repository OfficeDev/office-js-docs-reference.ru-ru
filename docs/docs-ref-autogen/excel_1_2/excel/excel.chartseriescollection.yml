methods:
- name: getItemAt(index)
  uid: excel!Excel.ChartSeriesCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: Возвращает ряд в зависимости от его позиции в коллекции.
  remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Get the name of the first series in the series collection.\nawait Excel.run(async (context) => { \n    var seriesCollection = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").series;\n    seriesCollection.load('items');\n    await context.sync();\n    \n    console.log(seriesCollection.items[0].name);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.ChartSeries;'
    parameters:
    - id: index
      description: Значение индекса получаемого объекта. Используется нулевой индекс.
      type: number
    return:
      type: <xref uid="excel!Excel.ChartSeries:class" />
      description: ''
