### YamlMime:TSType
name: Office.DialogParentMessageReceivedEventArgs
uid: office!Office.DialogParentMessageReceivedEventArgs:interface
package: office!
fullName: Office.DialogParentMessageReceivedEventArgs
summary: >-
  Предоставляет сведения о сообщении с родительской страницы, которая подняла `DialogParentMessageReceived` событие.


  Чтобы добавить обработник событий для `DialogParentMessageReceived` события, используйте `addHandlerAsync` метод [Office. Объект пользовательского](xref:office!Office.UI:interface) интерфейса.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: message
  uid: office!Office.DialogParentMessageReceivedEventArgs#message:member
  package: office!
  fullName: message
  summary: Получает содержимое сообщения, отправленного с родительской страницы, которое может быть любыми строками или строками данных.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'message: string;'
    return:
      type: string
- name: origin
  uid: office!Office.DialogParentMessageReceivedEventArgs#origin:member
  package: office!
  fullName: origin
  summary: Получает домен родительской страницы, который называется `Dialog.messageChild`<!-- -->.
  remarks: '**Набор требований:** [DialogOrigin 1.1](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/dialog-origin-requirement-sets)<!-- -->. Свойство находится `undefined` на клиентах, которые не поддерживают этот набор требований.'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'origin: string | undefined;'
    return:
      type: string | undefined
- name: type
  uid: office!Office.DialogParentMessageReceivedEventArgs#type:member
  package: office!
  fullName: type
  summary: Получает [Office. Значение переумерия EventType,](xref:office!Office.EventType:enum) которое определяет тип события, которое было поднято.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: EventType;'
    return:
      type: <xref uid="office!Office.EventType:enum" />
