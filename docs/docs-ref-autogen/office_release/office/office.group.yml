  remarks: Если `Group` объект является частью [Office. Объект RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) передается `requestUpdate` методу [Office. Лента](xref:office!Office.Ribbon:interface)<!-- -->, `controls` свойства различных [Office. Объекты группы](xref:office!Office.Group:interface) указывают, какие элементы управления имеют измененный статус включен; свойство родительского объекта `controls` `Group` объекта `Tab` игнорируется.
  isPreview: false
  isDeprecated: false
