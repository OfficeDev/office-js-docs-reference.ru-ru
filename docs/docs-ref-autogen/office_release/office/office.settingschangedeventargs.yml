### YamlMime:TSType
name: Office.SettingsChangedEventArgs
uid: office!Office.SettingsChangedEventArgs:interface
package: office!
fullName: Office.SettingsChangedEventArgs
summary: >-
  Предоставляет сведения о параметрах, вызвавших событие settingsChanged.


  Чтобы добавить обработник событий для события settingsChanged, используйте метод addHandlerAsync [объекта Office.Параметры.](xref:office!Office.Settings:interface)


  Событие settingsChanged сгорает только тогда, когда сценарий надстройки вызывает метод Параметры.saveAsync для сохранения копии параметров в памяти в файле документов. Событие settingsChanged не вызывается при вызове методов Settings.set и Settings.remove.


  Событие settingsChanged было разработано, чтобы позволить вам обрабатывать потенциальные конфликты, когда два или несколько пользователей пытаются сохранить параметры одновременно, когда ваша надстройка используется в совместном (совместном) документе.


  **Важно:** код надстройки может зарегистрировать обработчик для события settingsChanged, когда надстройка запущена с любым клиентом Excel, но событие будет запущено только тогда, когда надстройка будет загружена с помощью открытой в Excel в Интернете таблицы, и несколько пользователей редактируют таблицу (coauthoring). Таким образом, эффективно событие settingsChanged поддерживается только в Excel в Интернете сценариях совместной работы.
