### YamlMime:TSType
name: OfficeRuntime.AuthOptions
uid: office-runtime!OfficeRuntime.AuthOptions:interface
package: office-runtime!
fullName: OfficeRuntime.AuthOptions
summary: Предоставляет параметры для работы с пользователем, Office получает маркер доступа к надстройки из AAD v. 2.0 с методом `getAccessToken`.
remarks: Методы в этом интерфейсе эквивалентны методам в `Office.AuthOptions` интерфейсе. Если в будущем будут добавлены новые типы проверки подлинности, они будут добавлены только в `Office.AuthOptions` интерфейс. Для простоты примеры кода во всем использовании документации `Office.AuthOptions`<!-- -->.
isPreview: false
isDeprecated: false
type: interface
properties:
- name: allowConsentPrompt
  uid: office-runtime!OfficeRuntime.AuthOptions#allowConsentPrompt:member
  package: office-runtime!
  fullName: allowConsentPrompt
  summary: 'Позволяет Office получить маркер доступа молча или с помощью интерактивного согласия, если требуется. Значение по умолчанию: `false`.<!-- -->. Если установлено, что `false`<!-- -->, Office будет молча пытаться получить маркер доступа. Если это не удастся сделать, Office вернется описательная ошибка. Если установлено, что `true`<!-- -->, Office будет показывать интерактивный пользовательский интерфейс согласия после того, как он не сможет молча получить маркер доступа. Запрос разрешает только согласие на область AAD, а не на какие Graph области.'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowConsentPrompt?: boolean;'
    return:
      type: boolean
- name: allowSignInPrompt
  uid: office-runtime!OfficeRuntime.AuthOptions#allowSignInPrompt:member
  package: office-runtime!
  fullName: allowSignInPrompt
  summary: 'Позволяет Office безмолвно получать маркер доступа при условии, что согласие присутствует или показывает интерактивный пользовательский интерфейс, чтобы войти в пользователя. Значение по умолчанию: `false`.<!-- -->. Если установлено, что `false`<!-- -->, Office будет молча пытаться получить маркер доступа. Если это не удастся сделать, Office вернется описательная ошибка. Если установлено, что `true`<!-- -->, Office будет показывать интерактивный пользовательский интерфейс для входов после того, как он не сможет молча получить маркер доступа.'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowSignInPrompt?: boolean;'
    return:
      type: boolean
- name: asyncContext
  uid: office-runtime!OfficeRuntime.AuthOptions#asyncContext:member
  package: office-runtime!
  fullName: asyncContext
  summary: Элемент, определенный пользователем любого типа, возвращаемого без изменений, в свойстве объекта, который передается `asyncContext` `AsyncResult` обратному вызову.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'asyncContext?: any;'
    return:
      type: any
- name: authChallenge
  uid: office-runtime!OfficeRuntime.AuthOptions#authChallenge:member
  package: office-runtime!
  fullName: authChallenge
  summary: Вызывает Office, чтобы подсказыть пользователю дополнительный фактор, когда для аренды microsoft Graph требуется многофакторная проверка подлинности. Значение строки определяет тип необходимого дополнительного фактора. В большинстве случаев во время разработки не будет известно, требуется ли для клиента пользователя дополнительный фактор или какая строка должна быть. Таким образом, этот параметр будет использоваться в вызове "вторая попытка" после того, как корпорация Майкрософт Graph отправила ошибку с запросом дополнительного фактора и содержащей строку, которая должна использоваться `getAccessToken` с `authChallenge` этим параметром.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'authChallenge?: string;'
    return:
      type: string
- name: forceAddAccount
  uid: office-runtime!OfficeRuntime.AuthOptions#forceAddAccount:member
  package: office-runtime!
  fullName: forceAddAccount
  summary: 'Побуждает пользователя добавить свою учетную запись Office (или перейти к ней, если она уже добавлена). Значение по умолчанию: `false`.<!-- -->.'
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowSignInPrompt` instead.
  syntax:
    content: 'forceAddAccount?: boolean;'
    return:
      type: boolean
- name: forceConsent
  uid: office-runtime!OfficeRuntime.AuthOptions#forceConsent:member
  package: office-runtime!
  fullName: forceConsent
  summary: 'Сообщает Office, что нужно показать интерфейс согласия для надстройки. Это полезно, если разрешения Azure изменились или согласие пользователя было отозвано. Значение по умолчанию: `false`.<!-- -->.'
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: Use `allowConsentPrompt` instead.
  syntax:
    content: 'forceConsent?: boolean;'
    return:
      type: boolean
- name: forMSGraphAccess
  uid: office-runtime!OfficeRuntime.AuthOptions#forMSGraphAccess:member
  package: office-runtime!
  fullName: forMSGraphAccess
  summary: 'Вызывает Office возвращать описательные ошибки, когда надстройка хочет получить доступ к Microsoft Graph и пользователь/администратор не дал согласия на Graph области. Значение по умолчанию: `false`.<!-- -->. Office поддерживает согласие на Graph области только при развертывании надстройки администратором клиента. Эти сведения не будут доступны во время разработки. Настройка этого параметра приведет к Office предварительного информирования надстройки (возвращая описательные ошибки), если Graph `true` доступа не удастся.'
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'forMSGraphAccess?: boolean;'
    return:
      type: boolean
