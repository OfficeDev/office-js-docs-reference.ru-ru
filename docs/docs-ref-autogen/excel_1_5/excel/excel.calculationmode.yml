fields:
- name: automatic
  uid: excel!Excel.CalculationMode.automatic:member
  package: excel!
  summary: Поведение пересчета по умолчанию, Excel вычисляет результаты новой формулы при каждом смене соответствующих данных.
  value: "\"Automatic\""
- name: automaticExceptTables
  uid: excel!Excel.CalculationMode.automaticExceptTables:member
  package: excel!
  summary: Вычисляет результаты новой формулы каждый раз, когда меняются соответствующие данные, если только формула не находится в таблице данных.
  value: "\"AutomaticExceptTables\""
- name: manual
  uid: excel!Excel.CalculationMode.manual:member
  package: excel!
  summary: Вычисления происходят только в том случае, если пользователь или надстройка запрашивает их.
  value: "\"Manual\""
