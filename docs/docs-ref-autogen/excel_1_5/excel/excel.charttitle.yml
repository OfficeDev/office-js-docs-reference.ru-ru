- name: toJSON()
  uid: excel!Excel.ChartTitle#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект ChartTitle — это объект API, метод возвращает простой `toJSON` объект JavaScript (введите как`Excel.Interfaces.ChartTitleData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
