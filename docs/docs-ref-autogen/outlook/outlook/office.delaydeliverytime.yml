### YamlMime:TSType
name: Office.DelayDeliveryTime
uid: outlook!Office.DelayDeliveryTime:interface
package: outlook!
fullName: Office.DelayDeliveryTime
summary: Объект позволяет управлять датой и временем доставки сообщения `DelayDeliveryTime` с задержкой.
remarks: >-
  \[[Набор API: предварительный просмотр почтовых ящиков](/office/dev/add-ins/reference/requirement-sets/outlook-api-requirement-sets) \]


  **[Минимальный уровень разрешений:](https://docs.microsoft.com/office/dev/add-ins/outlook/understanding-outlook-add-in-permissions) <!-- -->**`ReadItem`


  **[Применимый Outlook:](https://docs.microsoft.com/office/dev/add-ins/outlook/outlook-add-ins-overview#extension-points) <!-- -->** Compose


  #### <a name="examples"></a>Примеры


  ```javascript

  var date_1 = new Date();

  var date_2 = new Date(date_1.getTime() + 2*60000);  // Sending with 2-minute delay.

  Office.context.mailbox.item.delayDeliveryTime.setAsync(
      date_2,
      function(callback) {
          console.log(callback);
      });
  ```
isPreview: false
isDeprecated: false
type: interface
