  remarks: '\[[Набор API: ExcelApi 1.4](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemOrNullObject(name: string): Excel.NamedItem;'
    parameters:
    - id: name
      description: Nameitem.
      type: string
    return:
      type: <xref uid="excel!Excel.NamedItem:class" />
      description: ''
- name: load(options)
