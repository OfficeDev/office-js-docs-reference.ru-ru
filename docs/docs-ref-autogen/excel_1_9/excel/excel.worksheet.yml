- name: findAll(text, criteria)
  uid: excel!Excel.Worksheet#findAll:member(1)
  package: excel!
  fullName: findAll(text, criteria)
  summary: Находит все вхождения `RangeAreas` данной строки на основе указанных критериев и возвращает их как объект, состоящий из одного или нескольких прямоугольных диапазонов.
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'findAll(text: string, criteria: Excel.WorksheetSearchCriteria): Excel.RangeAreas;'
    parameters:
    - id: text
      description: Строка для поиска.
      type: string
    - id: criteria
      description: Дополнительные критерии поиска, включая, должен ли поиск соответствовать всей ячейке или быть чувствительным к делу.
      type: <xref uid="excel!Excel.WorksheetSearchCriteria:interface" />
    return:
      type: <xref uid="excel!Excel.RangeAreas:class" />
      description: Объект `RangeAreas` , состоящий из одного или нескольких прямоугольных диапазонов, соответствует критериям поиска. Если ячейки не соответствуют этому критерию, будет `ItemNotFound` выброшена ошибка.
- name: findAllOrNullObject(text, criteria)
  uid: excel!Excel.Worksheet#findAllOrNullObject:member(1)
  package: excel!
  fullName: findAllOrNullObject(text, criteria)
  summary: Находит все вхождения `RangeAreas` данной строки на основе указанных критериев и возвращает их как объект, состоящий из одного или нескольких прямоугольных диапазонов.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-find-all.yaml

