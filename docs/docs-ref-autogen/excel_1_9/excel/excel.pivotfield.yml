- name: toJSON()
  uid: excel!Excel.PivotField#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект PivotField — это объект API, метод возвращает простой `toJSON` объект JavaScript (введите как`Excel.Interfaces.PivotFieldData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Excel.Interfaces.PivotFieldData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.PivotFieldData:interface" />
      description: ''
