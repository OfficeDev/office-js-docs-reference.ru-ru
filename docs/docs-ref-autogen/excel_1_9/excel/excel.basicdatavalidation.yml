### YamlMime:TSType
name: Excel.BasicDataValidation
uid: excel!Excel.BasicDataValidation:interface
package: excel!
fullName: Excel.BasicDataValidation
summary: Представляет основные критерии проверки данных типа.
remarks: '\[[Набор API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: formula1
  uid: excel!Excel.BasicDataValidation#formula1:member
  package: excel!
  fullName: formula1
  summary: 'Указывает операнд правой руки, когда свойство оператора задано двоичному оператору, такому как GreaterThan (левая операнд — это значение, в который пользователь пытается ввести в ячейку). С помощью ternary operators Between and NotBetween указывается нижний связанный операнд. Например, настройка формулы 1 до 10 и оператора в GreaterThan означает, что допустимые данные для диапазона должны быть больше 10. При настройке значения его можно передать в качестве числа, объекта диапазона или строковой формулы (где строка — это строка строки, ссылка ячейки типа "=A1" или формула типа "=MIN(A1, B1)"). При возврате значения оно всегда возвращается в качестве строки, например: "=10", "=A1", "=SUM(A1:B5)" и т.д.'
  remarks: '\[[Набор API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formula1: string | number | Range;'
    return:
      type: string | number | <xref uid="excel!Excel.Range:class" />
- name: formula2
  uid: excel!Excel.BasicDataValidation#formula2:member
  package: excel!
  fullName: formula2
  summary: 'С помощью ternary operators Between and NotBetween указывается верхний операнд. Не используется с двоичными операторами, такими как GreaterThan. При настройке значения его можно передать в качестве числа, объекта диапазона или строковой формулы (где строка — это строка строки, ссылка ячейки типа "=A1" или формула типа "=MIN(A1, B1)"). При возврате значения оно всегда возвращается в качестве строки, например: "=10", "=A1", "=SUM(A1:B5)" и т.д.'
  remarks: '\[[Набор API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formula2?: string | number | Range;'
    return:
      type: string | number | <xref uid="excel!Excel.Range:class" />
- name: operator
  uid: excel!Excel.BasicDataValidation#operator:member
  package: excel!
  fullName: operator
  summary: Оператор, используемый для проверки данных.
  remarks: '\[[Набор API: ExcelApi 1.8](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'operator: Excel.DataValidationOperator | "Between" | "NotBetween" | "EqualTo" | "NotEqualTo" | "GreaterThan" | "LessThan" | "GreaterThanOrEqualTo" | "LessThanOrEqualTo";'
    return:
      type: <xref uid="excel!Excel.DataValidationOperator:enum" /> | "Between" | "NotBetween" | "EqualTo" | "NotEqualTo" | "GreaterThan" | "LessThan" | "GreaterThanOrEqualTo" | "LessThanOrEqualTo"
