    content: 'color?: string;'
    return:
      type: string
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: Представляет стиль тире строки. Возвращает значение null, если линия является невидимой или используются несогласованные типы штриха. См. PowerPoint. Сведения о ShapeLineDashStyle.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: PowerPoint.ShapeLineDashStyle | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineDashStyle:enum" /> | "Dash" | "DashDot" | "DashDotDot" | "LongDash" | "LongDashDot" | "RoundDot" | "Solid" | "SquareDot" | "LongDashDotDot" | "SystemDash" | "SystemDot" | "SystemDashDot"
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#style:member
  package: powerpoint!
  fullName: style
  summary: Представляет тип линии фигуры. Возвращает значение null, если линия является невидимой или используются несогласованные стили. См. PowerPoint. ShapeLineStyle для подробных сведений.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: PowerPoint.ShapeLineStyle | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeLineStyle:enum" /> | "Single" | "ThickBetweenThin" | "ThickThin" | "ThinThick" | "ThinThin"
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Указывает процент прозрачности строки как значение от 0.0 (непрозрачная) до 1.0 (clear). Возвращает значение null, если в фигуре используются несогласованные параметры прозрачности.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#visible:member
  package: powerpoint!
  fullName: visible
  summary: Указывает, отображается ли форматирование строки элемента фигуры. Возвращается `null` , когда фигура имеет несогласованную видимость.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatUpdateData#weight:member
  package: powerpoint!
  fullName: weight
  summary: Представляет толщину линии (в пунктах). Возвращается `null` , когда строка не видна или имеются несовместимые весы строки.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: number;'
    return:
      type: number
