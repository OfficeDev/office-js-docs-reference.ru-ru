### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeLineFormatLoadOptions
summary: >-
  Представляет форматирование строки для объекта формы. Для изображений и геометрических фигур форматирование строки представляет границу фигуры.


  \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#$all:member
  package: powerpoint!
  fullName: $all
  summary: 'Указание `$all` для LoadOptions загружает все свойства scalar (например: `Range.address`<!-- -->), но не свойства навигации (например: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#color:member
  package: powerpoint!
  fullName: color
  summary: >-
    Представляет цвет строки в формате HTML-цветов, в форме \# RRGGBB (например, "FFA500") или в виде имени HTML-цвета (например, "оранжевый").


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: boolean;'
    return:
      type: boolean
- name: dashStyle
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#dashStyle:member
  package: powerpoint!
  fullName: dashStyle
  summary: >-
    Представляет стиль тире строки. Возвращает значение null, если линия является невидимой или используются несогласованные типы штриха. См. PowerPoint. Сведения о ShapeLineDashStyle.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'dashStyle?: boolean;'
    return:
      type: boolean
- name: style
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#style:member
  package: powerpoint!
  fullName: style
  summary: >-
    Представляет тип линии фигуры. Возвращает значение null, если линия является невидимой или используются несогласованные стили. См. PowerPoint. ShapeLineStyle для подробных сведений.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'style?: boolean;'
    return:
      type: boolean
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: >-
    Указывает процент прозрачности строки как значение от 0.0 (непрозрачная) до 1.0 (clear). Возвращает значение null, если в фигуре используются несогласованные параметры прозрачности.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: boolean;'
    return:
      type: boolean
- name: visible
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#visible:member
  package: powerpoint!
  fullName: visible
  summary: >-
    Указывает, отображается ли форматирование строки элемента фигуры. `null`Возвращается, когда фигура имеет несогласованную видимость.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
- name: weight
  uid: powerpoint!PowerPoint.Interfaces.ShapeLineFormatLoadOptions#weight:member
  package: powerpoint!
  fullName: weight
  summary: >-
    Представляет толщину линии (в пунктах). `null`Возвращается, когда строка не видна или имеются несовместимые весы строки.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'weight?: boolean;'
    return:
      type: boolean
