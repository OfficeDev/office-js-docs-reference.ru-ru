- name: addGeometricShape(geometricShapeType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addGeometricShape:member(1)
  package: powerpoint!
  fullName: addGeometricShape(geometricShapeType, options)
  summary: Добавляет геометрическую фигуру в слайд. Возвращает `Shape` объект, который представляет новую фигуру.
  remarks: "\\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var hexagon = shapes.addGeometricShape(PowerPoint.GeometricShapeType.hexagon, \n      {\n        left: 100,\n        top: 100,\n        height: 150,\n        width: 150\n      });\n  hexagon.name = \"Hexagon\";\n\n  await context.sync();\n});\n```"
