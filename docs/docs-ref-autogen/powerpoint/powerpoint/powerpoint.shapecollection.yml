- name: addTextBox(text, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addTextBox:member(1)
  package: powerpoint!
  fullName: addTextBox(text, options)
  summary: Добавляет текстовое поле на слайд с предоставленным текстом в качестве контента. Возвращает `Shape` объект, который представляет новое текстовое поле.
  remarks: "\\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n  var textbox = shapes.addTextBox(\"Hello!\", \n      { \n        left: 100, \n        top: 300, \n        height: 300, \n        width: 450 \n      });\n  textbox.name = \"Textbox\";\n\n  return context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addTextBox(text: string, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: text
      description: Указывает текст, который будет показан в созданном текстовом окне.
      type: string
    - id: options
      description: Необязательный параметр для указания дополнительных параметров, таких как расположение текстового окна.
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
