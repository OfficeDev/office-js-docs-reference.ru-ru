- name: addLine(connectorType, options)
  uid: powerpoint!PowerPoint.ShapeCollection#addLine:member(1)
  package: powerpoint!
  fullName: addLine(connectorType, options)
  summary: Добавляет строку в слайд. Возвращает `Shape` объект, который представляет новую строку.
  remarks: "\\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/preview-apis/shapes.yaml\nawait PowerPoint.run(async (context) => {\n  var shapes = context.presentation.slides.getItemAt(0).shapes;\n\n  // For a line, left and top are the coordinates of the start point,\n  // while height and width are the coordinates of the end point.\n  var line = shapes.addLine(PowerPoint.ConnectorType.straight, \n      { \n        left: 400, \n        top: 200, \n        height: 20, \n        width: 150 \n      });\n  line.name = \"StraightLine\";\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'addLine(connectorType?: PowerPoint.ConnectorType, options?: PowerPoint.ShapeAddOptions): PowerPoint.Shape;'
    parameters:
    - id: connectorType
      description: Указывает тип соединители строки. Если она не предоставлена, `straight` будет использоваться тип соединители. См. [PowerPoint. ConnectorType](xref:powerpoint!PowerPoint.ConnectorType:enum) для подробных сведений.
      type: <xref uid="powerpoint!PowerPoint.ConnectorType:enum" />
    - id: options
      description: Необязательный параметр, чтобы указать дополнительные параметры, такие как расположение объекта фигуры, который содержит строку.
      type: <xref uid="powerpoint!PowerPoint.ShapeAddOptions:interface" />
    return:
      type: <xref uid="powerpoint!PowerPoint.Shape:class" />
      description: Недавно вставленная фигура.
