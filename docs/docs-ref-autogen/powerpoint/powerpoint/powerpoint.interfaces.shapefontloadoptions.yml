### YamlMime:TSType
name: PowerPoint.Interfaces.ShapeFontLoadOptions
uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFontLoadOptions
summary: >-
  Представляет атрибуты шрифта, такие как имя шрифта, размер шрифта и цвет для объекта TextRange формы.


  \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
remarks: ''
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#$all:member
  package: powerpoint!
  fullName: $all
  summary: 'Указание `$all` для LoadOptions загружает все свойства scalar (например: `Range.address`<!-- -->), но не свойства навигации (например: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: bold
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#bold:member
  package: powerpoint!
  fullName: bold
  summary: >-
    Указывает, является ли шрифт полужирным. Возвращается, если в текст включены как жирные, так и `null` нежирные `TextRange` текстовые фрагменты.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'bold?: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#color:member
  package: powerpoint!
  fullName: color
  summary: >-
    Представление цветового кода HTML текстового цвета (например, \# "FF0000" представляет красный цвет). `null`Возвращается, если в текст включены `TextRange` фрагменты с разными цветами.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color?: boolean;'
    return:
      type: boolean
- name: italic
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#italic:member
  package: powerpoint!
  fullName: italic
  summary: >-
    Указывает, применяется ли курсив. Возвращает "null", если "TextRange" включает в себя как фрагменты текста, так и неиталические.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'italic?: boolean;'
    return:
      type: boolean
- name: name
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#name:member
  package: powerpoint!
  fullName: name
  summary: >-
    Представляет имя шрифта (например, "Калибри"). Если текст является сложным скриптом или восточноазиатским языком, это соответствующее имя шрифта; в противном случае это имя латинского шрифта.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'name?: boolean;'
    return:
      type: boolean
- name: size
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#size:member
  package: powerpoint!
  fullName: size
  summary: >-
    Представляет размер шрифта в точках (например, 11). Возвращает значение null, если объект TextRange включает фрагменты текста с разными размерами шрифта.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'size?: boolean;'
    return:
      type: boolean
- name: underline
  uid: powerpoint!PowerPoint.Interfaces.ShapeFontLoadOptions#underline:member
  package: powerpoint!
  fullName: underline
  summary: >-
    Тип подчеркивания, применяемый для шрифта. Возвращается, если в текст включены фрагменты с `null` разными `TextRange` подчеркнутными стилями. См. [PowerPoint. Подробные сведения о ShapeFontUnderlineStyle.](xref:powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum)


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'underline?: boolean;'
    return:
      type: boolean
