- name: horizontalAlignment
  uid: powerpoint!PowerPoint.ParagraphFormat#horizontalAlignment:member
  package: powerpoint!
  fullName: horizontalAlignment
  summary: >-
    Представляет горизонтальное выравнивание абзаца. Возвращает значение "null", если "TextRange" содержит текстовые фрагменты с различными значениями горизонтального выравнивания. См. [PowerPoint. ParagraphHorizontalAlignment для](xref:powerpoint!PowerPoint.ParagraphHorizontalAlignment:enum) подробных сведений.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
