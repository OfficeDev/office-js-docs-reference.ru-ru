methods:
- name: getSubstring(start, length)
  uid: powerpoint!PowerPoint.TextRange#getSubstring:member(1)
  package: powerpoint!
  fullName: getSubstring(start, length)
  summary: Возвращает объект `TextRange` для подстройки в заданный диапазон.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getSubstring(start: number, length?: number): PowerPoint.TextRange;'
    parameters:
    - id: start
      description: Нулевой индекс первого символа, получаемого из диапазона текста.
      type: number
    - id: length
      description: Необязательное свойство. Количество символов, которые будут возвращены в новом текстовом диапазоне. Если длина опущена, все символы от начала до конца последнего абзаца диапазона текста будут возвращены.
      type: number
    return:
      type: <xref uid="powerpoint!PowerPoint.TextRange:class" />
      description: ''
