- name: toJSON()
  uid: powerpoint!PowerPoint.TextRange#toJSON:member(1)
  package: powerpoint!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный PowerPoint. Объект TextRange — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`PowerPoint.Interfaces.TextRangeData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
