### YamlMime:TSEnum
name: PowerPoint.ShapeLineStyle
uid: powerpoint!PowerPoint.ShapeLineStyle:enum
package: powerpoint!
fullName: PowerPoint.ShapeLineStyle
summary: Указывает стиль для строки.
remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
fields:
- name: single
  uid: powerpoint!PowerPoint.ShapeLineStyle.single:member
  package: powerpoint!
  summary: Одна строка.
  value: "\"Single\""
- name: thickBetweenThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickBetweenThin:member
  package: powerpoint!
  summary: Толстая линия с тонкой линией с каждой стороны.
  value: "\"ThickBetweenThin\""
- name: thickThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thickThin:member
  package: powerpoint!
  summary: Толстая линия рядом с тонкой линией. Для горизонтальных линий толстая линия находится над тонкой линией. Для вертикальных линий толстая линия находится слева от тонкой линии.
  value: "\"ThickThin\""
- name: thinThick
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThick:member
  package: powerpoint!
  summary: Толстая линия рядом с тонкой линией. Для горизонтальных линий толстая линия находится ниже тонкой линии. Для вертикальных линий толстая линия находится справа от тонкой линии.
  value: "\"ThinThick\""
- name: thinThin
  uid: powerpoint!PowerPoint.ShapeLineStyle.thinThin:member
  package: powerpoint!
  summary: Две тонкие линии.
  value: "\"ThinThin\""
