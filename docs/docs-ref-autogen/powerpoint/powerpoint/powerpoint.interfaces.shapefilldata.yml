name: PowerPoint.Interfaces.ShapeFillData
uid: powerpoint!PowerPoint.Interfaces.ShapeFillData:interface
package: powerpoint!
fullName: PowerPoint.Interfaces.ShapeFillData
summary: Интерфейс, описывающий данные, возвращаемые по вызову `shapeFill.toJSON()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: foregroundColor
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#foregroundColor:member
  package: powerpoint!
  fullName: foregroundColor
  summary: >-
    Представляет цвет переднего плана заполнения фигуры в формате HTML-цвета в форме \# RRGGBB (например, "FFA500") или в виде имени HTML-цвета (например, "оранжевый").


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'foregroundColor?: string;'
    return:
      type: string
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: >-
    Указывает процент прозрачности заполнения как значение от 0.0 (непрозрачная) до 1.0 (clear). Возвращается, если тип формы не поддерживает прозрачность или заполнение фигуры имеет несогласованную прозрачность, например с типом `null` заполнения градиента.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
- name: type
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillData#type:member
  package: powerpoint!
  fullName: type
  summary: >-
    Возвращает тип заливки фигуры. См. [PowerPoint. ShapeFillType](xref:powerpoint!PowerPoint.ShapeFillType:enum) для подробных сведений.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'type?: PowerPoint.ShapeFillType | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFillType:enum" /> | "NoFill" | "Solid" | "Gradient" | "Pattern" | "PictureAndTexture" | "SlideBackground"
