### YamlMime:TSEnum
name: PowerPoint.TextVerticalAlignment
uid: powerpoint!PowerPoint.TextVerticalAlignment:enum
package: powerpoint!
fullName: PowerPoint.TextVerticalAlignment
summary: Представляет вертикальное выравнивание [PowerPoint. TextFrame](xref:powerpoint!PowerPoint.TextFrame:class) в [PowerPoint. Shape](xref:powerpoint!PowerPoint.Shape:class)<!-- -->. Если выбран один из центрных параметров, `TextFrame` `Shape` содержимое будет по центру горизонтально внутри группы. Чтобы изменить горизонтальное выравнивание текста, см. PowerPoint[. ParagraphFormat](xref:powerpoint!PowerPoint.ParagraphFormat:class) [и PowerPoint. ParagraphHorizontalAlignment](xref:powerpoint!PowerPoint.ParagraphHorizontalAlignment:enum)<!-- -->.
remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
fields:
- name: bottom
  uid: powerpoint!PowerPoint.TextVerticalAlignment.bottom:member
  package: powerpoint!
  summary: Указывает, что дно `TextFrame` должно быть приведено в соответствие с `Shape`<!-- -->.
  value: "\"Bottom\""
- name: bottomCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.bottomCentered:member
  package: powerpoint!
  summary: Указывает, что нижний `TextFrame` должен быть выравнивается вертикально к `Shape`<!-- -->. Содержимое будет `TextFrame` центризо- `Shape`<!-- -->.
  value: "\"BottomCentered\""
- name: middle
  uid: powerpoint!PowerPoint.TextVerticalAlignment.middle:member
  package: powerpoint!
  summary: Указывает, что центр `TextFrame` должен быть приведен в соответствие с `Shape`<!-- -->.
  value: "\"Middle\""
- name: middleCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.middleCentered:member
  package: powerpoint!
  summary: Указывает, что центр `TextFrame` должен быть выровнен вертикально к `Shape`<!-- -->. Содержимое будет `TextFrame` центризо- `Shape`<!-- -->.
  value: "\"MiddleCentered\""
- name: top
  uid: powerpoint!PowerPoint.TextVerticalAlignment.top:member
  package: powerpoint!
  summary: Указывает, что верхний `TextFrame` должен быть приведен в соответствие с `Shape`<!-- -->.
  value: "\"Top\""
- name: topCentered
  uid: powerpoint!PowerPoint.TextVerticalAlignment.topCentered:member
  package: powerpoint!
  summary: Указывает, что верхний `TextFrame` должен быть приведен вертикально к `Shape`<!-- -->. Содержимое будет `TextFrame` центризо- `Shape`<!-- -->.
  value: "\"TopCentered\""
