    content: 'foregroundColor?: string;'
    return:
      type: string
- name: transparency
  uid: powerpoint!PowerPoint.Interfaces.ShapeFillUpdateData#transparency:member
  package: powerpoint!
  fullName: transparency
  summary: Указывает процент прозрачности заполнения как значение от 0.0 (непрозрачная) до 1.0 (clear). Возвращается `null` , если тип формы не поддерживает прозрачность или заполнение фигуры имеет несогласованную прозрачность, например с типом заполнения градиента.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'transparency?: number;'
    return:
      type: number
