  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный PowerPoint. Объект ShapeFont — это объект API, `toJSON` метод возвращает обычный объект JavaScript (введите как`PowerPoint.Interfaces.ShapeFontData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
