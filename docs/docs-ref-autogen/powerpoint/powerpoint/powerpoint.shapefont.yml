### YamlMime:TSType
name: PowerPoint.ShapeFont
uid: powerpoint!PowerPoint.ShapeFont:class
package: powerpoint!
fullName: PowerPoint.ShapeFont
summary: Представляет атрибуты шрифта, такие как имя шрифта, размер шрифта и цвет для объекта TextRange формы.
remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: class
properties:
- name: bold
  uid: powerpoint!PowerPoint.ShapeFont#bold:member
  package: powerpoint!
  fullName: bold
  summary: Указывает, является ли шрифт полужирным. Возвращается `null` , если в `TextRange` текст включены как жирные, так и нежирные текстовые фрагменты.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'bold: boolean;'
    return:
      type: boolean
- name: color
  uid: powerpoint!PowerPoint.ShapeFont#color:member
  package: powerpoint!
  fullName: color
  summary: Представление цветового кода HTML в текстовом цвете (например, "\#FF0000" представляет красный цвет). Возвращается `null` , если в `TextRange` текст включены фрагменты с разными цветами.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'color: string;'
    return:
      type: string
- name: context
  uid: powerpoint!PowerPoint.ShapeFont#context:member
  package: powerpoint!
  fullName: context
  summary: Контекст запроса, связанный с объектом. Это связывает процесс надстройки с процессом Office хост-приложения.
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'context: RequestContext;'
    return:
      type: <xref uid="powerpoint!PowerPoint.RequestContext:class" />
- name: italic
  uid: powerpoint!PowerPoint.ShapeFont#italic:member
  package: powerpoint!
  fullName: italic
  summary: Указывает, применяется ли курсив. Возвращает "null", если "TextRange" включает в себя как фрагменты текста, так и неиталические.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'italic: boolean;'
    return:
      type: boolean
- name: name
  uid: powerpoint!PowerPoint.ShapeFont#name:member
  package: powerpoint!
  fullName: name
  summary: Представляет имя шрифта (например, "Калибри"). Если текст является сложным скриптом или восточноазиатским языком, это соответствующее имя шрифта; в противном случае это имя латинского шрифта.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
- name: size
  uid: powerpoint!PowerPoint.ShapeFont#size:member
  package: powerpoint!
  fullName: size
  summary: Представляет размер шрифта в точках (например, 11). Возвращает значение null, если объект TextRange включает фрагменты текста с разными размерами шрифта.
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'size: number;'
    return:
      type: number
- name: underline
  uid: powerpoint!PowerPoint.ShapeFont#underline:member
  package: powerpoint!
  fullName: underline
  summary: Тип подчеркивания, применяемый для шрифта. Возвращается `null` , если в `TextRange` текст включены фрагменты с разными подчеркнутными стилями. См[. PowerPoint. Подробные сведения о ShapeFontUnderlineStyle](xref:powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum).
  remarks: '\[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'underline: PowerPoint.ShapeFontUnderlineStyle | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeFontUnderlineStyle:enum" /> | "None" | "Single" | "Double" | "Heavy" | "Dotted" | "DottedHeavy" | "Dash" | "DashHeavy" | "DashLong" | "DashLongHeavy" | "DotDash" | "DotDashHeavy" | "DotDotDash" | "DotDotDashHeavy" | "Wavy" | "WavyHeavy" | "WavyDouble"
