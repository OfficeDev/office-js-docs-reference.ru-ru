- name: autoSizeSetting
  uid: powerpoint!PowerPoint.Interfaces.TextFrameUpdateData#autoSizeSetting:member
  package: powerpoint!
  fullName: autoSizeSetting
  summary: >-
    Автоматические параметры размеров для текстового кадра. Для рамки с текстом можно настроить автоматический подбор размера текста в соответствии с размером рамки, автоматический подбор размера рамки в соответствии с содержимым или не выполнять автоматический подбор размера.


    \[[API set: PowerPointApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'autoSizeSetting?: PowerPoint.ShapeAutoSize | "AutoSizeNone" | "AutoSizeTextToFitShape" | "AutoSizeShapeToFitText" | "AutoSizeMixed";'
    return:
      type: <xref uid="powerpoint!PowerPoint.ShapeAutoSize:enum" /> | "AutoSizeNone" | "AutoSizeTextToFitShape" | "AutoSizeShapeToFitText" | "AutoSizeMixed"
