      description: 'Определяет способ использования столбцов или строк в качестве рядов данных на диаграмме. Может быть одним из следующих: Auto (по умолчанию), Строки и Столбцы. Подробные `Excel.ChartSeriesBy` сведения см. в материале.'
      type: "\"Auto\" | \"Columns\" | \"Rows\""
    return:
      type: void
      description: ''
- name: setPosition(startCell, endCell)
  uid: excel!Excel.Chart#setPosition:member(1)
  package: excel!
  fullName: setPosition(startCell, endCell)
  summary: Располагает диаграмму относительно ячеек на листе.
  remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait Excel.run(async (context) => { \n    var sheetName = \"Charts\";\n    var rangeSelection = \"A1:B4\";\n    var range = context.workbook.worksheets.getItem(sheetName).getRange(rangeSelection);\n    var sourceData = sheetName + \"!\" + \"A1:B4\";\n    var chart = context.workbook.worksheets.getItem(sheetName).charts.add(\"pie\", range, \"auto\");\n    chart.width = 500;\n    chart.height = 300;\n    chart.setPosition(\"C2\", null);\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'setPosition(startCell: Range | string, endCell?: Range | string): void;'
    parameters:
    - id: startCell
      description: Начальная ячейка. Место, куда будет перемещена диаграмма. Начальная ячейка — это верхняя левая или верхняя правая ячейка (это зависит от того, использует ли пользователь параметры отображения справа налево).
      type: <xref uid="excel!Excel.Range:class" /> | string
    - id: endCell
      description: Необязательный. Конечная ячейка. Если указан этот параметр, значения ширины и высоты диаграммы будут заданы так, чтобы полностью покрыть данную ячейку или диапазон.
      type: <xref uid="excel!Excel.Range:class" /> | string
    return:
      type: void
      description: ''
- name: toJSON()
  uid: excel!Excel.Chart#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный Excel. Объект Chart — это объект API, `toJSON` метод возвращает простой объект JavaScript (введите как`Excel.Interfaces.ChartData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Excel.Interfaces.ChartData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.ChartData:interface" />
      description: ''
