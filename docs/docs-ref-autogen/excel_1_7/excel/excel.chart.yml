- name: legend
  uid: excel!Excel.Chart#legend:member
  package: excel!
  fullName: legend
  summary: Представляет условные обозначения для диаграммы.
  remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Set to show legend of Chart1 and make it on top of the chart.\nawait Excel.run(async (context) => { \n    var chart = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\");    \n    chart.legend.visible = true;\n    chart.legend.position = \"Top\"; \n    chart.legend.overlay = false; \n    await context.sync()\n    \n    console.log(\"Legend Shown \");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'readonly legend: Excel.ChartLegend;'
    return:
      type: <xref uid="excel!Excel.ChartLegend:class" />
- name: name
  uid: excel!Excel.Chart#name:member
  package: excel!
  fullName: name
  summary: Указывает имя объекта диаграммы.
  remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Rename the chart to new name, resize the chart to 200 points in both height and weight.\n// Move Chart1 to 100 points to the top and left.\nawait Excel.run(async (context) => { \n    var chart = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\");    \n    chart.name = \"New Name\";\n    chart.top = 100;\n    chart.left = 100;\n    chart.height = 200;\n    chart.width = 200;\n    await context.sync(); \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
