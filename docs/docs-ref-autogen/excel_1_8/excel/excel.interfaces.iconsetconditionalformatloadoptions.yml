  package: excel!
  fullName: reverseIconOrder
  summary: Если `true`<!-- -->, отменяет заказы значка для набора значков. Обратите внимание, что это невозможно установить, если используются настраиваемые значки.
  remarks: '\[[Набор API: ExcelApi 1.6](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
