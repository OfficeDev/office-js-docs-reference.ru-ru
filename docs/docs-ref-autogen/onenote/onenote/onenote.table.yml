- name: getCell(rowIndex, cellIndex)
  uid: onenote!OneNote.Table#getCell:member(1)
  package: onenote!
  fullName: getCell(rowIndex, cellIndex)
  summary: Возвращает ячейку таблицы в указанной строке и указанном столбце.
  remarks: "\\[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait OneNote.run(async (context) => {\n    var app = context.application;\n    var outline = app.getActiveOutline();\n    \n    // Queue a command to load outline.paragraphs and their types.\n    context.load(outline, \"paragraphs, paragraphs/type\");\n    \n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    var paragraphs = outline.paragraphs;\n    \n    // For each table, get a cell in the second row and third column.\n    for (var i = 0; i < paragraphs.items.length; i++) {\n        var paragraph = paragraphs.items[i];\n        if (paragraph.type == \"Table\") {\n            var table = paragraph.table;\n            var cell = table.getCell(2 /*Row Index*/, 3 /*Column Index*/);\n        }\n    }\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getCell(rowIndex: number, cellIndex: number): OneNote.TableCell;'
    parameters:
    - id: rowIndex
      description: Индекс строки.
      type: number
    - id: cellIndex
      description: Индекс ячейки в строке.
      type: number
    return:
      type: <xref uid="onenote!OneNote.TableCell:class" />
      description: ''
- name: insertColumn(index, values)
  uid: onenote!OneNote.Table#insertColumn:member(1)
  package: onenote!
  fullName: insertColumn(index, values)
  summary: Вставляет столбец в положении заданного индекса в таблице. Значения указываются в новом столбце. В противном случае столбец будет пустым.
  remarks: "\\[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait OneNote.run(async (context) => {\n    var app = context.application;\n    var outline = app.getActiveOutline();\n    \n    // Queue a command to load outline.paragraphs and their types.\n    context.load(outline, \"paragraphs, paragraphs/type\");\n    \n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    var paragraphs = outline.paragraphs;\n    \n    // For each table, insert a column at index two.\n    for (var i = 0; i < paragraphs.items.length; i++) {\n        var paragraph = paragraphs.items[i];\n        if (paragraph.type == \"Table\") {\n            var table = paragraph.table;\n            table.insertColumn(2, [\"cell0\", \"cell1\"]);\n        }\n    }\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'insertColumn(index: number, values?: string[]): void;'
    parameters:
    - id: index
      description: Индекс в таблице, в положении которого будет вставлен столбец.
      type: number
    - id: values
      description: Необязательный. Строки, которые необходимо вставить в новый столбец, заданные в виде массива. Значений в этом параметре не должно быть больше, чем строк в таблице.
      type: string[]
    return:
      type: void
      description: ''
