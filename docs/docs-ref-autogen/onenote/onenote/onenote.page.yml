- name: addOutline(left, top, html)
  uid: onenote!OneNote.Page#addOutline:member(1)
  package: onenote!
  fullName: addOutline(left, top, html)
  summary: Добавляет объект Outline на страницу в заданной позиции.
  remarks: "\\[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Gets the active page.\n    var page = context.application.getActivePage();\n\n    // Queue a command to add an outline with given html.\n    var outline = page.addOutline(200, 200,\n\"<p>Images and a table below:</p> \\\n <img src=\\\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAHElEQVQI12P4//8/w38GIAXDIBKE0DHxgljNBAAO9TXL0Y4OHwAAAABJRU5ErkJggg==\\\"> \\\n <img src=\\\"http://imagenes.es.sftcdn.net/es/scrn/6653000/6653659/microsoft-onenote-2013-01-535x535.png\\\"> \\\n <table> \\\n   <tr> \\\n     <td>Jill</td> \\\n     <td>Smith</td> \\\n     <td>50</td> \\\n   </tr> \\\n   <tr> \\\n     <td>Eve</td> \\\n     <td>Jackson</td> \\\n     <td>94</td> \\\n   </tr> \\\n </table>\"     \n        );\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addOutline(left: number, top: number, html: string): OneNote.Outline;'
    parameters:
    - id: left
      description: Левая позиция верхней части, левый угол объекта Outline.
      type: number
    - id: top
      description: Верхняя позиция верхней части, левый угол объекта Outline.
      type: number
    - id: html
      description: Строка HTML, описывающая визуальное представление объекта Outline. См[. поддерживаемый HTML](https://docs.microsoft.com/office/dev/add-ins/onenote/onenote-add-ins-page-content#supported-html) для OneNote API JavaScript надстройки.
      type: string
    return:
      type: <xref uid="onenote!OneNote.Outline:class" />
      description: ''
