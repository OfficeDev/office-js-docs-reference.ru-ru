- name: insertPageAsSibling(locationString, title)
  uid: onenote!OneNote.Page#insertPageAsSibling:member(2)
  package: onenote!
  fullName: insertPageAsSibling(locationString, title)
  summary: Вставляет новую страницу перед текущей страницей или после нее.
  remarks: >-
    \[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    await OneNote.run(async (context) => {

        // Gets the active page.
        var activePage = context.application.getActivePage();

        // Queue a command to add a new page after the active page.
        var newPage = activePage.insertPageAsSibling("After", "Next Page");

        // Queue a command to load the newPage to access its data.
        context.load(newPage);

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();
        console.log("page is created with title: " + newPage.title);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'insertPageAsSibling(locationString: "Before" | "After", title: string): OneNote.Page;'
    parameters:
    - id: locationString
      description: Расположение новой страницы относительно текущей страницы.
      type: "\"Before\" | \"After\""
    - id: title
      description: Название новой страницы.
      type: string
    return:
      type: <xref uid="onenote!OneNote.Page:class" />
      description: ''
