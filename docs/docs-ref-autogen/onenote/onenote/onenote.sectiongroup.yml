- name: toJSON()
  uid: onenote!OneNote.SectionGroup#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный OneNote. Объект SectionGroup — это объект API, `toJSON` метод возвращает простой объект JavaScript (введите как`OneNote.Interfaces.SectionGroupData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
