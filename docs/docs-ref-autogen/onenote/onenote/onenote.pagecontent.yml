methods:
- name: delete()
  uid: onenote!OneNote.PageContent#delete:member(1)
  package: onenote!
  fullName: delete()
  summary: Удаляет объект PageContent.
  remarks: >-
    \[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    await OneNote.run(async (context) => {

        var page = context.application.getActivePage();
        var pageContents = page.contents;

        var firstPageContent = pageContents.getItemAt(0);
        firstPageContent.load('type');

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();
        if (firstPageContent.isNullObject === false) {
            firstPageContent.delete();
            await context.sync();
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(): void;'
    return:
      type: void
      description: ''
