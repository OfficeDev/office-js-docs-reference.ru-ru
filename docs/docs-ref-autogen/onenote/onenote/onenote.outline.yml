methods:
- name: appendHtml(html)
  uid: onenote!OneNote.Outline#appendHtml:member(1)
  package: onenote!
  fullName: appendHtml(html)
  summary: Добавляет указанный HTML в нижнюю часть объекта Outline.
  remarks: >-
    \[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    await OneNote.run(async (context) => {

        // Gets the active page.
        var activePage = context.application.getActivePage();

        // Get pageContents of the activePage.
        var pageContents = activePage.contents;

        // Queue a command to load the pageContents to access its data.
        context.load(pageContents);

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();
        if (pageContents.items.length != 0 && pageContents.items[0].type == "Outline")
        {
            // First item is an outline.
            let outline = pageContents.items[0].outline;

            // Queue a command to append a paragraph to the outline.
            outline.appendHtml("<p>new paragraph</p>");

            // Run the queued commands.
            await context.sync();
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'appendHtml(html: string): void;'
    parameters:
    - id: html
      description: Строка HTML, которую необходимо добавить. См[. поддерживаемый HTML](https://docs.microsoft.com/office/dev/add-ins/onenote/onenote-add-ins-page-content#supported-html) для OneNote API JavaScript надстройки.
      type: string
    return:
      type: void
      description: ''
