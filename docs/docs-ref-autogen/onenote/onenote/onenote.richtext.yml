- name: load(propertyNames)
  uid: onenote!OneNote.RichText#load:member(2)
  package: onenote!
  fullName: load(propertyNames)
  summary: Добавляет в очередь команду для загрузки указанных свойств объекта. Перед чтением свойств требуется вызвать метод `context.sync()`.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): OneNote.RichText;'
    parameters:
    - id: propertyNames
      description: Запятая или массив строк, которые указывают свойства для загрузки.
      type: string | string[]
    return:
      type: <xref uid="onenote!OneNote.RichText:class" />
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait OneNote.run(async (context) => {\n\n    // Get the collection of pageContent items from the page.\n    var pageContents = context.application.getActivePage().contents;\n\n    // Get the first PageContent on the page, and then get its outline's paragraphs.\n    var outlinePageContents = ;\n    var paragraphs = ;\n    var richTextParagraphs = ;\n    // Queue a command to load the id and type of each page content in the outline.\n    pageContents.load(\"id,type\");\n\n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n\n    // Load all page contents of type Outline.\n    $.each(pageContents.items, function(index, pageContent) {\n        if(pageContent.type == 'Outline')\n        {\n            pageContent.load('outline,outline/paragraphs,outline/paragraphs/type');\n            outlinePageContents.push(pageContent);\n        }\n    });\n    await context.sync();\n\n    // Load all rich text paragraphs across outlines.\n    $.each(outlinePageContents, function(index, outlinePageContent) {\n        var outline = outlinePageContent.outline;\n        paragraphs = paragraphs.concat(outline.paragraphs.items);\n    });\n    $.each(paragraphs, function(index, paragraph) {\n        if(paragraph.type == 'RichText')\n        {\n            richTextParagraphs.push(paragraph);\n            paragraph.load(\"id,richText/text\");\n        }\n    });\n    await context.sync();\n\n    // Display all rich text paragraphs to the console.\n    $.each(richTextParagraphs, function(index, richTextParagraph) {\n        var richText = richTextParagraph.richText;\n        console.log(\n            \"Paragraph found with richtext content : \" + \n            richText.text + \" and richtext id : \" + richText.id);\n    });\n    await context.sync();\n});\n```"
