- name: toJSON()
  uid: onenote!OneNote.InkAnalysis#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный OneNote. Объект InkAnalysis — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`OneNote.Interfaces.InkAnalysisData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
