- name: getActiveNotebook()
  uid: onenote!OneNote.Application#getActiveNotebook:member(1)
  package: onenote!
  fullName: getActiveNotebook()
  summary: Получает активную записную книжку, если она есть. Если такой записной книжки нет, создается исключение ItemNotFound.
  remarks: "\\[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nawait OneNote.run(async (context) => {\n        \n    // Get the active notebook.\n    var notebook = context.application.getActiveNotebook();\n            \n    // Queue a command to load the notebook.\n    // For best performance, request specific properties.\n    notebook.load('id,name');\n            \n    // Run the queued commands, and return a promise to indicate task completion.\n    await context.sync();\n                    \n    // Show some properties.\n    console.log(\"Notebook name: \" + notebook.name);\n    console.log(\"Notebook ID: \" + notebook.id);\n            \n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getActiveNotebook(): OneNote.Notebook;'
    return:
      type: <xref uid="onenote!OneNote.Notebook:class" />
      description: ''
- name: getActiveNotebookOrNull()
  uid: onenote!OneNote.Application#getActiveNotebookOrNull:member(1)
  package: onenote!
  fullName: getActiveNotebookOrNull()
  summary: Получает активную записную книжку, если она есть. Если такой записной книжки нет, возвращается значение null.
  remarks: >-
    \[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    await OneNote.run(async (context) => {

        // Get the active notebook.
        var notebook = context.application.getActiveNotebookOrNull();

        // Queue a command to load the notebook.
        // For best performance, request specific properties.
        notebook.load('id,name');

        // Run the queued commands, and return a promise to indicate task completion.
        await context.sync();

        // Check if active notebook is set.
        if (!notebook.isNullObject) {
            console.log("Notebook name: " + notebook.name);
            console.log("Notebook ID: " + notebook.id);
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getActiveNotebookOrNull(): OneNote.Notebook;'
    return:
      type: <xref uid="onenote!OneNote.Notebook:class" />
      description: ''
