methods:
- name: getBase64Image()
  uid: onenote!OneNote.Image#getBase64Image:member(1)
  package: onenote!
  fullName: getBase64Image()
  summary: 'Получает двоичное представление объекта Image в кодировке Base64. Пример: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIA...'
  remarks: "\\[[Набор API: OneNoteApi 1.1](/office/dev/add-ins/reference/requirement-sets/onenote-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\nvar image = null;\nvar imageString;\n\nawait OneNote.run(async (context) => {\n    // Get the current outline.\n    var outline = context.application.getActiveOutline();\n    \n    // Queue a command to load paragraphs and their types.\n    outline.load(\"paragraphs/type\")\n    await context.sync();\n    for (var i=0; i < outline.paragraphs.items.length; i++) {\n        var paragraph = outline.paragraphs.items[i];\n        if (paragraph.type == \"Image\")\n        {\n            image = paragraph.image;\n        }\n    }\n\n    if (image != null) {\n        imageString = image.getBase64Image();\n        await context.sync();\n    }\n\n    console.log(imageString);\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getBase64Image(): OfficeExtension.ClientResult<string>;'
    return:
      type: <xref uid="office!OfficeExtension.ClientResult:class" />&lt;string&gt;
      description: ''
