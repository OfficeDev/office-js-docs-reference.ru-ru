- name: toJSON()
  uid: onenote!OneNote.SectionGroupCollection#toJSON:member(1)
  package: onenote!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) Если исходный объект `OneNote.SectionGroupCollection` является объектом API, `toJSON` метод возвращает обычный объект JavaScript (введите как `OneNote.Interfaces.SectionGroupCollectionData`<!-- -->), содержащий массив "items" с мелкими копиями любых загруженных свойств из элементов коллекции.
  remarks: ''
