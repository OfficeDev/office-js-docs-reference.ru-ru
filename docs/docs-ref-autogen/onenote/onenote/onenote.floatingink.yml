  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный OneNote. Объект FloatingInk — это объект API, `toJSON` метод возвращает обычный объект JavaScript (введите как`OneNote.Interfaces.FloatingInkData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
