### YamlMime:TSType
name: Excel.Interfaces.ApplicationData
uid: excel!Excel.Interfaces.ApplicationData:interface
package: excel!
fullName: Excel.Interfaces.ApplicationData
summary: Интерфейс, описывающий данные, возвращаемые по вызову `application.toJSON()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: calculationEngineVersion
  uid: excel!Excel.Interfaces.ApplicationData#calculationEngineVersion:member
  package: excel!
  fullName: calculationEngineVersion
  summary: Возвращает версию модуля вычислений Excel, использованного для последнего полного пересчета.
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'calculationEngineVersion?: number;'
    return:
      type: number
- name: calculationMode
  uid: excel!Excel.Interfaces.ApplicationData#calculationMode:member
  package: excel!
  fullName: calculationMode
  summary: 'Возвращает режим вычисления, используемый в книге, как это определено константами в `Excel.CalculationMode`<!-- -->. Возможные значения: `Automatic`<!-- -->, где Excel контролирует пересчет;`AutomaticExceptTables`<!-- -->, где Excel контролирует пересчет, но игнорирует изменения в таблицах;`Manual`<!-- -->, где вычисление делается, когда пользователь запрашивает его.'
  remarks: '\[[Набор API: ExcelApi 1.1 для получения, 1.8 для набора](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'calculationMode?: Excel.CalculationMode | "Automatic" | "AutomaticExceptTables" | "Manual";'
    return:
      type: <xref uid="excel!Excel.CalculationMode:enum" /> | "Automatic" | "AutomaticExceptTables" | "Manual"
- name: calculationState
  uid: excel!Excel.Interfaces.ApplicationData#calculationState:member
  package: excel!
  fullName: calculationState
  summary: Возвращает состояние вычисления приложения. Подробные `Excel.CalculationState` сведения см. в материале.
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'calculationState?: Excel.CalculationState | "Done" | "Calculating" | "Pending";'
    return:
      type: <xref uid="excel!Excel.CalculationState:enum" /> | "Done" | "Calculating" | "Pending"
- name: cultureInfo
  uid: excel!Excel.Interfaces.ApplicationData#cultureInfo:member
  package: excel!
  fullName: cultureInfo
  summary: Предоставляет сведения, основанные на текущих параметрах культуры системы. Это включает имена культур, форматирование номеров и другие параметры, зависящие от культуры.
  remarks: '\[[Набор API: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cultureInfo?: Excel.Interfaces.CultureInfoData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.CultureInfoData:interface" />
- name: decimalSeparator
  uid: excel!Excel.Interfaces.ApplicationData#decimalSeparator:member
  package: excel!
  fullName: decimalSeparator
  summary: Получает строку, используемую в качестве десятичных сепараторов для числевых значений. Это основано на локальных параметрах Excel.
  remarks: '\[[Набор API: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'decimalSeparator?: string;'
    return:
      type: string
- name: iterativeCalculation
  uid: excel!Excel.Interfaces.ApplicationData#iterativeCalculation:member
  package: excel!
  fullName: iterativeCalculation
  summary: Возвращает параметры итеративных вычислений. В Excel на Windows Mac параметры будут применяться к приложению Excel. В Excel в Интернете и других платформах параметры будут применяться к активной книге.
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'iterativeCalculation?: Excel.Interfaces.IterativeCalculationData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.IterativeCalculationData:interface" />
- name: thousandsSeparator
  uid: excel!Excel.Interfaces.ApplicationData#thousandsSeparator:member
  package: excel!
  fullName: thousandsSeparator
  summary: Получает строку, используемую для отдельных групп цифр слева от десятичной для числимых значений. Это основано на локальных параметрах Excel.
  remarks: '\[[Набор API: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'thousandsSeparator?: string;'
    return:
      type: string
- name: useSystemSeparators
  uid: excel!Excel.Interfaces.ApplicationData#useSystemSeparators:member
  package: excel!
  fullName: useSystemSeparators
  summary: Указывает, включены ли системные Excel системы. Системные сепараторы включают десятичной сепаратор и тысячный сепаратор.
  remarks: '\[[Набор API: ExcelApi 1.11](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'useSystemSeparators?: boolean;'
    return:
      type: boolean
