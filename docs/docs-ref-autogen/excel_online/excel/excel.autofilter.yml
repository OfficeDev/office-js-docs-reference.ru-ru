methods:
- name: apply(range, columnIndex, criteria)
  uid: excel!Excel.AutoFilter#apply:member(1)
  package: excel!
  fullName: apply(range, columnIndex, criteria)
  summary: Применяет автофильтр к диапазону. При этом фильтруется столбец, если указаны индекс столбца и условия фильтрации.
  remarks: "\\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml\nawait Excel.run(async (context) => {\n    // This method adds a percentage AutoFilter to the active worksheet \n    // and applies the filter to a column of the used range.\n\n    // Retrieve the active worksheet and the used range on that worksheet.\n    const sheet = context.workbook.worksheets.getActiveWorksheet();\n    const farmData = sheet.getUsedRange();\n\n    // Add a filter that will only show the rows with the top 50% of values in column 3.\n    sheet.autoFilter.apply(farmData, 3, {\n        criterion1: \"50\",\n        filterOn: Excel.FilterOn.topPercent\n    });\n\n    await context.sync();\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'apply(range: Range | string, columnIndex?: number, criteria?: Excel.FilterCriteria): void;'
    parameters:
    - id: range
      description: Диапазон, на который будет применяться autoFilter.
      type: <xref uid="excel!Excel.Range:class" /> | string
    - id: columnIndex
      description: Индекс столбца с нулевой базой, к которому применяется AutoFilter.
      type: number
    - id: criteria
      description: Критерии фильтрации.
      type: <xref uid="excel!Excel.FilterCriteria:interface" />
    return:
      type: void
      description: ''
- name: clearColumnCriteria(columnIndex)
  uid: excel!Excel.AutoFilter#clearColumnCriteria:member(1)
  package: excel!
  fullName: clearColumnCriteria(columnIndex)
  summary: Очищает критерии фильтрации столбцов автофайлов.
  remarks: >-
    \[[Набор API: ExcelApi 1.14](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method clears the AutoFilter setting from one column.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Clear the filter from only column 3.
        sheet.autoFilter.clearColumnCriteria(3);
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'clearColumnCriteria(columnIndex: number): void;'
    parameters:
    - id: columnIndex
      description: Индекс столбцов с нулевой базой, который представляет, какой фильтр столбцов необходимо очистить. Если значение индекса не поддерживается (например, если значение отрицательное или если значение больше количества доступных столбцов в диапазоне), то будет выброшено `InvalidArgument` исключение.
      type: number
    return:
      type: void
      description: ''
