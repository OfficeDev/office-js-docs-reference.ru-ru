- name: reapply()
  uid: excel!Excel.AutoFilter#reapply:member(1)
  package: excel!
  fullName: reapply()
  summary: Применяет указанный объект Autofilter, находящийся в настоящее время в диапазоне.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method refreshes the AutoFilter to ensure that changes are captured.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Reapply the filter to capture changes.
        sheet.autoFilter.reapply();
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'reapply(): void;'
    return:
      type: void
      description: ''
- name: remove()
  uid: excel!Excel.AutoFilter#remove:member(1)
  package: excel!
  fullName: remove()
  summary: Удаляет автофильтр из диапазона.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/54-worksheet/worksheet-auto-filter.yaml

    await Excel.run(async (context) => {
        // This method removes all AutoFilters from the active worksheet.

        // Retrieve the active worksheet.
        const sheet = context.workbook.worksheets.getActiveWorksheet();

        // Remove all filters.
        sheet.autoFilter.remove();
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'remove(): void;'
    return:
      type: void
      description: ''
- name: toJSON()
  uid: excel!Excel.AutoFilter#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект AutoFilter — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`Excel.Interfaces.AutoFilterData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'toJSON(): Excel.Interfaces.AutoFilterData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.AutoFilterData:interface" />
      description: ''
