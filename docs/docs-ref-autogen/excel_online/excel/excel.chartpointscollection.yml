- name: getItemAt(index)
  uid: excel!Excel.ChartPointsCollection#getItemAt:member(1)
  package: excel!
  fullName: getItemAt(index)
  summary: Получение точки на основании ее положения в ряду.
  remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Set the border color for the first points in the points collection.\nawait Excel.run(async (context) => { \n    var points = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").series.getItemAt(0).points;\n    points.getItemAt(0).format.fill.setSolidColor(\"8FBC8F\");\n    await context.sync();\n    \n    console.log(\"Point Border Color Changed\");\n});\n```"
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItemAt(index: number): Excel.ChartPoint;'
    parameters:
    - id: index
      description: Значение индекса получаемого объекта. Используется нулевой индекс.
      type: number
    return:
      type: <xref uid="excel!Excel.ChartPoint:class" />
      description: ''
