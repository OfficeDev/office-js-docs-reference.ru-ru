- name: getFirst()
  uid: excel!Excel.TableScopedCollection#getFirst:member(1)
  package: excel!
  fullName: getFirst()
  summary: Получает первую таблицу в коллекции. Таблицы в коллекции сортироваться сверху вниз и слева направо, так что верхняя левая таблица является первой таблицей в коллекции.
