  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект DataConnectionCollection — это объект API, метод возвращает простой `toJSON` объект JavaScript (введите как`Excel.Interfaces.DataConnectionCollectionData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
