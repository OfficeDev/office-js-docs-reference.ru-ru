### YamlMime:TSType
name: Excel.ChartFont
uid: excel!Excel.ChartFont:class
package: excel!
fullName: Excel.ChartFont
summary: Этот объект представляет атрибуты шрифта (например, имя шрифта, размер шрифта и цвет) для объекта диаграммы.
remarks: "\\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Set the chart title font to Calibri, size 10, bold, and the color red.\nawait Excel.run(async (context) => { \n    var title = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").title;\n    title.format.font.name = \"Calibri\";\n    title.format.font.size = 12;\n    title.format.font.color = \"#FF0000\";\n    title.format.font.italic =  false;\n    title.format.font.bold = true;\n    title.format.font.underline = \"None\";\n    await context.sync();\n});\n```"
isPreview: false
isDeprecated: false
