### YamlMime:TSType
name: OfficeRuntime.Auth
uid: office-runtime!OfficeRuntime.Auth:interface
package: office-runtime!
fullName: OfficeRuntime.Auth
summary: Интерфейс, содержащий API, связанные с авторизацией.
remarks: Методы в этом интерфейсе эквивалентны методам в `Office.auth` интерфейсе. Если в будущем будут добавлены новые типы проверки подлинности, они будут добавлены только в `Office.auth` интерфейс. Для простоты примеры кода во всем использовании документации `Office.auth`<!-- -->.
isPreview: false
isDeprecated: false
type: interface
methods:
- name: getAccessToken(options)
  uid: office-runtime!OfficeRuntime.Auth#getAccessToken:member(1)
  package: office-runtime!
  fullName: getAccessToken(options)
  summary: >-
    Вызывает конечную точку Azure Active Directory версии 2.0, чтобы получить маркер доступа к вашей надстройке в веб-приложении. Позволяет надстройки идентифицировать пользователей. Серверный код может использовать этот маркер для доступа Graph Microsoft для веб-приложения надстройки с помощью потока [OAuth "от имени"](https://docs.microsoft.com/azure/active-directory/develop/active-directory-v2-protocols-oauth-on-behalf-of)<!-- -->. Для этого API необходима конфигурация единого входа, связывающая надстройку с приложением Azure. Пользователи Office входят с помощью учетных записей организаций и учетных записей Майкрософт. Microsoft Azure возвращает маркеры, предназначенные для учетных записей обоих типов, для доступа к ресурсам в Microsoft Graph.


    **Важно.** В Outlook этот API не поддерживается, если надстройка загружается в почтовый ящик Outlook.com или Gmail.
  remarks: '**Хосты:** Excel, Outlook, PowerPoint, Word'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getAccessToken(options?: AuthOptions): Promise<string>;'
    parameters:
    - id: options
      description: Необязательный параметр. Принимает объект `AuthOptions` для определения поведения при входе.
      type: <xref uid="office-runtime!OfficeRuntime.AuthOptions:interface" />
    return:
      type: Promise&lt;string&gt;
      description: Обещание маркера доступа.
