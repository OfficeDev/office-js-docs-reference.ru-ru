- name: InfobarClicked
  uid: office!Office.EventType.InfobarClicked:member
  package: office!
  summary: >-
    Происходит в Outlook, когда действие выбирается в уведомлении с определенным [пользовательским действием](https://docs.microsoft.com/javascript/api/outlook/office.notificationmessagedetails#actions)<!-- -->. В настоящее время "Dismiss" является единственным поддерживаемым действием, которое увольнять это событие.


    **Важно**: это событие доступно только с реализацией области задач.


    Чтобы добавить обработник событий для `InfobarClicked` события, используйте `addHandlerAsync` метод `Item` объекта. Обработник событий получает аргумент типа Office[. InfobarClickedEventArgs](https://docs.microsoft.com/javascript/api/outlook/office.infobarclickedeventargs?view=outlook-js-1.10)<!-- -->.


    \[[Набор API: почтовый ящик 1.10](/office/dev/add-ins/reference/javascript-api-for-office) \]
