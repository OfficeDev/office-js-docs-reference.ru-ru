    Чтобы добавить обработник событий для `ItemChanged` события, используйте `addHandlerAsync` метод `Mailbox` объекта.


    \[[Набор API: почтовый ящик 1.5](/office/dev/add-ins/reference/javascript-api-for-office) \]
