### YamlMime:TSEnum
name: Office.EventType
uid: office!Office.EventType:enum
package: office!
fullName: Office.EventType
summary: >-
  Указывает тип вызванного события. Возвращается свойством `type` `*EventArgs` объекта.


  Надстройки для Project поддерживают`Office.EventType.ResourceSelectionChanged`<!-- -->, `Office.EventType.TaskSelectionChanged`<!-- -->и типы `Office.EventType.ViewSelectionChanged` событий.


  Только надстройки области задач для Outlook поддерживают типы событий API почтовых ящиков.
remarks: '**`BindingDataChanged` и `BindingSelectionChanged` хостов**: Excel, Word.'
isPreview: false
isDeprecated: false
fields:
- name: ActiveViewChanged
  uid: office!Office.EventType.ActiveViewChanged:member
  package: office!
  summary: Событие Document.ActiveViewChanged было поднято в PowerPoint.
- name: AppointmentTimeChanged
  uid: office!Office.EventType.AppointmentTimeChanged:member
  package: office!
  summary: >-
    Происходит, когда в Outlook меняется дата или время выбранной встречи или серии. **Важно**: доступно только с реализацией области задач.


    Чтобы добавить обработник событий для `AppointmentTimeChanged` события, используйте `addHandlerAsync` метод `Item` объекта. Обработник событий получает аргумент типа Office[. AppointmentTimeChangedEventArgs](https://docs.microsoft.com/javascript/api/outlook/office.appointmenttimechangedeventargs?view=outlook-js-1.7)<!-- -->.


    \[[Набор API: почтовый ящик 1.7](/office/dev/add-ins/reference/javascript-api-for-office) \]
- name: AttachmentsChanged
  uid: office!Office.EventType.AttachmentsChanged:member
  package: office!
  summary: >-
    Возникает при добавлении или удалении вложения из элемента. **Важно**: доступно только с реализацией области задач.


    Чтобы добавить обработник событий для `AttachmentsChanged` события, используйте `addHandlerAsync` метод `Item` объекта. Обработник событий получает аргумент типа Office[. AttachmentsChangedEventArgs](https://docs.microsoft.com/javascript/api/outlook/office.attachmentschangedeventargs?view=outlook-js-1.8)<!-- -->.


    \[[Набор API: почтовый ящик 1.8](/office/dev/add-ins/reference/javascript-api-for-office) \]
- name: BindingDataChanged
  uid: office!Office.EventType.BindingDataChanged:member
