### YamlMime:TSType
name: Office.Tab
uid: office!Office.Tab:interface
package: office!
fullName: Office.Tab
summary: Представляет индивидуальную вкладку и состояние, на который она должна быть. Примеры кода см. в [примере Enable and Disable Add-in Commands](https://docs.microsoft.com/office/dev/add-ins/design/disable-add-in-commands) and [Create custom contextual tabs](https://docs.microsoft.com/office/dev/add-ins/design/contextual-tabs)<!-- -->.
remarks: '**Набор требований**: [RibbonAPI 1.1](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/ribbon-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: controls
  uid: office!Office.Tab#controls:member
  package: office!
  fullName: controls
  summary: Указывает один или несколько элементов управления на вкладке, таких как элементы меню, кнопки и т.д.
  remarks: Если объект `Tab` является частью [Office. Объект RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) передается методу `requestUpdate` Office[. Лента](xref:office!Office.Ribbon:interface)<!-- -->, это свойство указывает ID элементов управления, состояние которых должно быть изменено. Однако если на `groups` вкладке есть свойство, `controls` это свойство игнорируется и свойства указанных групп необходимо использовать для изменения состояния включенного.
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'controls?: Control[];'
    return:
      type: <xref uid="office!Office.Control:interface" />[]
- name: groups
  uid: office!Office.Tab#groups:member
  package: office!
  fullName: groups
  summary: Указывает одну или несколько групп управления на вкладке.
  remarks: >-
    Если объект `Tab` является частью [Office. Объект RibbonUpdaterData](xref:office!Office.RibbonUpdaterData:interface) передается методу `requestUpdate` Office[. Лента](xref:office!Office.Ribbon:interface)<!-- -->, свойства `controls` различных Office[. Объекты группы](xref:office!Office.Group:interface) указывают, какие элементы управления имеют измененный статус включен; свойство `controls` объекта `Tab` игнорируется.


    **Набор требований**: [RibbonAPI 1.1](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/ribbon-api-requirement-sets)
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'groups?: Group[];'
    return:
      type: <xref uid="office!Office.Group:interface" />[]
- name: id
  uid: office!Office.Tab#id:member
  package: office!
  fullName: id
  summary: Идентификатор вкладки, указанный в манифесте.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id: string;'
    return:
      type: string
- name: visible
  uid: office!Office.Tab#visible:member
  package: office!
  fullName: visible
  summary: Указывает, видна ли вкладка на ленте. Используется только с контекстными вкладками.
  remarks: '**Набор требований**: [RibbonAPI 1.2](https://docs.microsoft.com/office/dev/add-ins/reference/requirement-sets/ribbon-api-requirement-sets)'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'visible?: boolean;'
    return:
      type: boolean
