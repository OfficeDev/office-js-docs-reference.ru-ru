### YamlMime:TSEnum
name: Office. FileType
uid: office!Office.FileType:enum
package: office!
fullName: Office.FileType
summary: Указывает формат, в котором возвращается документ.
remarks: ''
isPreview: false
isDeprecated: false
fields:
- name: Сжатый
  uid: office!Office.FileType.Compressed:member
  package: office!
  summary: >-
    Возвращает весь документ (.pptx, .docx, .xlsx или .xlsm) в формате Office Open XML (OOXML) в виде массива byte.


    Примечание. Тип файла .xslm поддерживается в Excel на Windows и Mac. Он не поддерживается в Excel в Интернете. В Excel на Windows, `getFileAsync` срезы файлов из метода включают файлы подписи VBA для типов файлов xslm. Файлы подписи VBA являются vbaProjectSignature.bin, vbaProbjectSignatureAgile.bin и vbaProjectSignatureV3.bin. В Excel Mac срезы `getFileAsync` файлов из метода не включают файлы подписи VBA, так как эта платформа не поддерживает функцию подписи VBA.
- name: Pdf
  uid: office!Office.FileType.Pdf:member
  package: office!
  summary: Возвращает весь документ в формате PDF в виде массива байтов.
- name: Текст
  uid: office!Office.FileType.Text:member
  package: office!
  summary: Возвращает только текст документа в виде строки.
