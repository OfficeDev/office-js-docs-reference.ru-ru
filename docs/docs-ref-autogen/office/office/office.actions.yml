### YamlMime:TSType
name: Office.Actions
uid: office!Office.Actions:interface
package: office!
fullName: Office.Actions
summary: Управление действиями и клавишами.
remarks: '**Набор требований**: [SharedRuntime 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/shared-runtime-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: associate
  uid: office!Office.Actions#associate:member
  package: office!
  fullName: associate
  summary: Связывает ID действия с функцией.
  remarks: '**Набор требований**: [SharedRuntime 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/shared-runtime-requirement-sets)'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'associate: (actionId: string, actionFunction: (arg?: any) => void) => void;'
    return:
      type: '(actionId: string, actionFunction: (arg?: any) =&gt; void) =&gt; void'
methods:
- name: areShortcutsInUse(shortcuts)
  uid: office!Office.Actions#areShortcutsInUse:member(1)
  package: office!
  fullName: areShortcutsInUse(shortcuts)
  summary: Проверяет, используется ли набор комбинаций ярлыков для пользователя, как это определено другой надстройки или Office приложения.
  remarks: '**Набор требований**: [KeyboardShortcuts 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/keyboard-shortcuts-requirement-sets)'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'areShortcutsInUse(shortcuts: string[]): Promise<{shortcut: string, inUse: boolean}[]>;'
    parameters:
    - id: shortcuts
      description: 'Массив комбинаций ярлыков. Пример: `["Ctrl+1", "Ctrl+2"]`<!-- -->.'
      type: string[]
    return:
      type: 'Promise&lt;{shortcut: string, inUse: boolean}[]&gt;'
      description: 'Обещание, разрешаемого массиву объектов. Каждый объект состоит из сочетания ярлыков и значения Boolean. Значение в том `true` случае, если сочетание ярлыков противоречит ярлыку другой надстройки или с ярлыком приложения Office; в противном случае,`false`<!-- -->. Пример: `[{shortcut:"Ctrl+1", inUse:true},{shortcut:"Ctrl+2", inUse:false}]`<!-- -->.'
- name: getShortcuts()
  uid: office!Office.Actions#getShortcuts:member(1)
  package: office!
  fullName: getShortcuts()
  summary: Получает существующие ярлыки для надстройки. Набор всегда включает (1) ярлыки, определенные в расширенном манифесте надстройки для клавиш и (2) пользовательские ярлыки текущего пользователя, если они существуют. Ярлык может быть, `null` если он конфликтует с ярлыком другой надстройки или с Office приложением. В частности, было `null` бы, если при запросе выбрать ярлык для использования, пользователь не выбрал действие текущей надстройки. Дополнительные сведения о конфликтах с ярлыками см. в этой ссылке избегайте комбинаций ключей, которые используются другими [надстройки.](https://docs.microsoft.com/office/dev/add-ins/design/keyboard-shortcuts#avoid-key-combinations-in-use-by-other-add-ins)<!-- -->.
  remarks: '**Набор требований**: [KeyboardShortcuts 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/keyboard-shortcuts-requirement-sets)'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getShortcuts(): Promise<{[actionId: string]: string|null}>;'
    return:
      type: 'Promise&lt;{[actionId: string]: string|null}&gt;'
      description: 'Обещание, разрешаемого объекту ярлыков, с ключами, которые являются ID-данными действий (как определено в расширенном манифесте), а значения — сочетаниями ярлыков. Пример: `{"SetItalic": "Ctrl+1", "SetBold": "Ctrl+2", "SetUnderline": null}`<!-- -->.'
- name: replaceShortcuts(shortcuts)
  uid: office!Office.Actions#replaceShortcuts:member(1)
  package: office!
  fullName: replaceShortcuts(shortcuts)
  summary: Заменяет существующие ярлыки надстройки пользовательскими ярлыками для пользователя.
  remarks: '**Набор требований**: [KeyboardShortcuts 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/keyboard-shortcuts-requirement-sets)'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'replaceShortcuts(shortcuts: {[actionId: string]: string}): Promise<void>;'
    parameters:
    - id: shortcuts
      description: 'Объект пользовательских ярлыков с ключами— это ИД действий (как определено в расширенном манифесте), а значения — сочетания ярлыков. Пример: `{"SetItalic": "Ctrl+1", "SetBold": "Ctrl+2"}`<!-- -->. Чтобы узнать, как указать допустимый ID действий и комбинацию ключей, см. в рубрезе Добавление настраиваемой клавиши в [Office надстройки](https://docs.microsoft.com/office/dev/add-ins/design/keyboard-shortcuts)<!-- -->. (Обратите внимание, что сочетание ключей может быть `null`<!-- -->, в этом случае действие сохраняет комбинацию ключей, указанную в файле JSON.)'
      type: '{[actionId: string]: string}'
    return:
      type: Promise&lt;void&gt;
      description: Обещание, которое устраняется при регистрации `shortcuts` каждого настраиваемой уступки ярлыка. Даже если существует конфликт с существующими ярлыками, настраиваемый ярлык будет зарегистрирован. В противном случае обещание будет отклонено с помощью кода ошибки и сообщения об ошибке. Код ошибки "InvalidOperation" `shortcuts` возвращается, если не существует какого-либо кода действия или если комбинация ярлыков недействительна.
