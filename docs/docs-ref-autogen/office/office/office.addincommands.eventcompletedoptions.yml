properties:
- name: allowEvent
  uid: office!Office.AddinCommands.EventCompletedOptions#allowEvent:member
  package: office!
  fullName: allowEvent
  summary: Значение boolean. Когда завершенный метод используется для сигнала о завершении обработчицы событий, это значение указывает, следует ли продолжить выполнение обрабатываемого события или отменить его. Например, надстройка, `ItemSend` которая обрабатывает событие, `allowEvent` `false` может отменить отправку сообщения.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'allowEvent: boolean;'
    return:
      type: boolean
- name: errorMessage
  uid: office!Office.AddinCommands.EventCompletedOptions#errorMessage:member
  package: office!
  fullName: errorMessage
  summary: >-
    Строковая величина. Когда завершенный метод используется для сигнала `allowEvent` о завершении обработи- `false`<!-- -->Это значение задает сообщение об ошибке, которое будет отображаться пользователю. Например, обратитесь к [погонам Smart Alerts](https://docs.microsoft.com/office/dev/add-ins/outlook/smart-alerts-onmessagesend-walkthrough)<!-- -->.


    \[[Набор API: предварительный просмотр почтовых ящиков](/office/dev/add-ins/reference/javascript-api-for-office) \]
  remarks: ''
