### YamlMime:TSType
name: Office.Dialog
uid: office!Office.Dialog:interface
package: office!
fullName: Office.Dialog
summary: Объект, возвращаемый при призвании `UI.displayDialogAsync` . Он предоставляет методы регистрации обработчиков событий и закрытия диалогов.
remarks: '**Набор требований**: [DialogAPI](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-api-requirement-sets)'
isPreview: false
isDeprecated: false
type: interface
methods:
- name: addEventHandler(eventType, handler)
  uid: office!Office.Dialog#addEventHandler:member(1)
  package: office!
  fullName: addEventHandler(eventType, handler)
  summary: >-
    Регистрирует обработчик событий. Ниже приведены два поддерживаемых события.


    - DialogMessageReceived. Триггер — отправка сообщения из диалогового окна родительской странице.


    - DialogEventReceived. Триггер — закрытие диалогового окна или его выгрузка иным способом.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addEventHandler(eventType: Office.EventType, handler: (args: {message: string, origin: string | undefined} | {error: number}) => void): void;'
    parameters:
    - id: eventType
      description: Должен быть либо DialogMessageReceived, либо DialogEventReceived.
      type: <xref uid="office!Office.EventType:enum" />
    - id: handler
      description: Функция, которая принимает объект с свойством и `message` `origin` свойством, если `eventType``DialogMessageReceived`<!-- -->или объект с свойством`error`, если `eventType``DialogEventReceived`<!-- -->. Обратите внимание, что `origin` свойство находится `undefined` на клиентах, которые не поддерживают [DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets)<!-- -->.
      type: '(args: {message: string, origin: string | undefined} | {error: number}) =&gt; void'
    return:
      type: void
      description: ''
- name: close()
  uid: office!Office.Dialog#close:member(1)
  package: office!
  fullName: close()
  summary: >-
    Вызывается с родительской страницы, чтобы закрыть соответствующее диалоговое окно.


    Этот метод является асинхронным. Он не принимает параметр обратного вызова и не возвращает объект Promise, `await` поэтому его нельзя ожидать ни с ключевым словом, ни с функцией `then` . Дополнительные сведения см. в этом примере: [открытие другого диалоговое окно сразу после его закрытия](https://docs.microsoft.com/office/dev/add-ins/develop/dialog-best-practices#opening-another-dialog-immediately-after-closing-one).
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'close(): void;'
    return:
      type: void
      description: ''
- name: messageChild(message, messageOptions)
  uid: office!Office.Dialog#messageChild:member(1)
  package: office!
  fullName: messageChild(message, messageOptions)
  summary: Доставляет сообщение с хост-страницы, например области задач или файла функций без пользовательского интерфейса, в диалоговое окно, открытое со страницы.
  remarks: >-
    **Хосты**: Excel, Outlook (минимальный набор требований: почтовый ящик 1.9), PowerPoint, Word


    **Наборы требований**:


    - [DialogAPI 1.2](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-api-requirement-sets)


    - [Mailbox 1.9](https://docs.microsoft.com/javascript/api/requirement-sets/outlook/outlook-api-requirement-sets)


    - Если параметр `messageOptions` используется, также требуется [DialogOrigin 1.1](https://docs.microsoft.com/javascript/api/requirement-sets/common/dialog-origin-requirement-sets) .
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'messageChild(message: string, messageOptions?: DialogMessageOptions): void;'
    parameters:
    - id: message
      description: Принимает сообщение с хост-страницы для доставки в диалоговое окно. Все, что можно отправить в строку, включая JSON и XML, можно отправить.
      type: string
    - id: messageOptions
      description: Необязательно. Предоставляет варианты отправки сообщения.
      type: <xref uid="office!Office.DialogMessageOptions:interface" />
    return:
      type: void
      description: ''
- name: sendMessage(name)
  uid: office!Office.Dialog#sendMessage:member(1)
  package: office!
  fullName: sendMessage(name)
  summary: ТОЛЬКО ДЛЯ ВНУТРЕННЕГО ИСПОЛЬЗОВАНИЯ. НЕ ВЫЗЫВАЙ КОД.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'sendMessage(name: string): void;'
    parameters:
    - id: name
      description: ''
      type: string
    return:
      type: void
      description: ''
