isDeprecated: false
type: interface
methods:
- name: addNamespaceAsync(prefix, ns, options, callback)
  uid: office!Office.CustomXmlPrefixMappings#addNamespaceAsync:member(1)
  package: office!
  fullName: addNamespaceAsync(prefix, ns, options, callback)
  summary: Асинхронно добавляет префикс к сопоставлению пространства имен для использования при запрашивании элемента.
  remarks: >-
    **Набор требований**: [CustomXmlParts](https://docs.microsoft.com/javascript/api/requirement-sets/common/office-add-in-requirement-sets#customxmlparts)


    Если для запрошенного префикса пространство имен не назначено, метод возвращает пустую строку ("").
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addNamespaceAsync(prefix: string, ns: string, options?: Office.AsyncContextOptions, callback?: (result: AsyncResult<void>) => void): void;'
    parameters:
    - id: prefix
      description: Задает префикс, добавляемый в список сопоставлений префиксов. Обязательный параметр.
      type: string
    - id: ns
      description: Указывает пространство имен URI, чтобы назначить добавленную префиксу. Обязательный аргумент.
      type: string
    - id: options
      description: Предоставляет возможность сохранения контекстных данных любого типа без изменений для использования в вызове.
      type: <xref uid="office!Office.AsyncContextOptions:interface" />
    - id: callback
      description: Необязательно. Функция, вызываемая при возвращении обратного вызова, единственный параметр которой — тип Office[. AsyncResult](xref:office!Office.AsyncResult:interface)<!-- -->.
      type: '(result: <xref uid="office!Office.AsyncResult:interface" />&lt;void&gt;) =&gt; void'
    return:
      type: void
      description: ''
