### YamlMime:TSType
name: Office.BeforeDocumentCloseNotification
uid: office!Office.BeforeDocumentCloseNotification:interface
package: office!
fullName: Office.BeforeDocumentCloseNotification
summary: Представляет диалоговое окно уведомлений modal, которое может отображаться при попытке пользователя закрыть документ. Документ не закрывается, пока пользователь не ответит. Диалоговое окно уведомлений позволит пользователю подтвердить запрос о закрытии документа или отменить его.
remarks: '\[[API set: SharedRuntime BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
isPreview: true
isDeprecated: false
type: interface
methods:
- name: disable()
  uid: office!Office.BeforeDocumentCloseNotification#disable:member(1)
  package: office!
  fullName: disable()
  summary: Не позволяет диалоговую окантовку уведомлений появляться при попытке пользователя закрыть документ.
  remarks: '\[[API set: SharedRuntime BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'disable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: enable()
  uid: office!Office.BeforeDocumentCloseNotification#enable:member(1)
  package: office!
  fullName: enable()
  summary: Включить диалоговое окно модального уведомления, которое появляется при попытке пользователя закрыть документ. Документ не закрывается, пока пользователь не ответит. Этот диалоговое окно уведомлений запрашивает у пользователя подтверждение запроса о закрытии документа или позволяет пользователю отменить запрос о закрытии документа.
  remarks: '\[[API set: SharedRuntime BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'enable(): Promise<void>;'
    return:
      type: Promise&lt;void&gt;
      description: ''
- name: onCloseActionCancelled(listener)
  uid: office!Office.BeforeDocumentCloseNotification#onCloseActionCancelled:member(1)
  package: office!
  fullName: onCloseActionCancelled(listener)
  summary: 'Добавляет обработник событий, который обнаруживает при отмене `BeforeDocumentCloseNotification` операции закрытия. Этот обработник событий запускается, если одно из следующих условий будет выполнены: 1. Когда диалоговое окно уведомлений открыто,  конечный пользователь щелкает кнопку Не закрывайте в диалоговом окну, щелкает кнопку Закрыть в правом верхнем углу диалогов или нажимает клавишу Esc. 2. Когда надстройка вызывает `enable` метод на `BeforeDocumentCloseNotification` объекте.'
  remarks: '\[[API set: SharedRuntime BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/javascript-api-for-office) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: >-
      onCloseActionCancelled(
                  listener: () => void
              ): Promise<() => Promise<void>>;
    parameters:
    - id: listener
      description: Обработник событий, который вызван при отмене диалогов.
      type: () =&gt; void
    return:
      type: Promise&lt;() =&gt; Promise&lt;void&gt;&gt;
      description: Обещание, которое разрешит при добавлении обработера событий.
