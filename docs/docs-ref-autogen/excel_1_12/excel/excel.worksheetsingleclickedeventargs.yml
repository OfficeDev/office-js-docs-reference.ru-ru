### YamlMime:TSType
name: Excel.WorksheetSingleClickedEventArgs
uid: excel!Excel.WorksheetSingleClickedEventArgs:interface
package: excel!
fullName: Excel.WorksheetSingleClickedEventArgs
summary: Предоставляет сведения о событии с щелчком влево и прослушиваемом событии и связанном с ним информационном таблице.
remarks: '\[[Набор API: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.WorksheetSingleClickedEventArgs#address:member
  package: excel!
  fullName: address
  summary: Получает адрес, представляющий ячейку, по которой выполнен щелчок левой кнопкой мыши или нажатие, для определенного листа.
  remarks: >-
    \[[Набор API: ExcelApi 1.10](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/30-events/event-worksheet-single-click.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getActiveWorksheet();
        sheet.onSingleClicked.add((event) => {
            return Excel.run((context) => {
                console.log(`Click detected at ${event.address} (pixel offset from upper-left cell corner: ${event.offsetX}, ${event.offsetY})`);
                return context.sync();
            });
        });

        console.log("The worksheet click handler is registered.");

        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
