  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.ChartLineFormat;'
    parameters:
    - id: propertyNames
      description: Запятая или массив строк, которые указывают свойства для загрузки.
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.ChartLineFormat:class" />
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Set chart major gridlines on value axis to be red.\nawait Excel.run(async (context) => {\n    var gridlines = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\").axes.valueAxis.majorGridlines;\n    gridlines.format.line.color = \"#FF0000\";\n    await context.sync()\n    \n    console.log(\"Chart Gridlines Color Updated\");\n});\n```"
