  uid: excel!Excel.Interfaces.NamedItemLoadOptions#type:member
  package: excel!
  fullName: type
  summary: Указывает тип значения, возвращаемого по формуле имени. Подробные `Excel.NamedItemType` сведения см. в материале.
  remarks: '\[[Набор API: ExcelApi 1.1 для String, Integer, Double, Boolean, Range,Error; 1.7 для Array](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type?: boolean;'
    return:
      type: boolean
