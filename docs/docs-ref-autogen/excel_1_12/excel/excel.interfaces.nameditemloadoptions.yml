  uid: excel!Excel.Interfaces.NamedItemLoadOptions#comment:member
  package: excel!
  fullName: comment
  summary: Указывает комментарий, связанный с этим именем.
  remarks: '\[[Набор API: ExcelApi 1.4](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'comment?: boolean;'
    return:
      type: boolean
- name: formula
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#formula:member
  package: excel!
  fullName: formula
  summary: Формула названного элемента. Формулы всегда начинаются с равного знака ("=").
  remarks: '\[[Набор API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formula?: boolean;'
    return:
      type: boolean
- name: name
