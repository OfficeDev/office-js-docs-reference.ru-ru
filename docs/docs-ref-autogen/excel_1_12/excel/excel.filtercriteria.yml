  fullName: color
  summary: Строка цвета HTML, которая используется для фильтрации ячеек. Используется при `cellColor` `fontColor` фильтрации и фильтрации.
  remarks: '\[[Набор API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
