name: Excel.PivotTableScopedCollection
uid: excel!Excel.PivotTableScopedCollection:class
package: excel!
fullName: Excel.PivotTableScopedCollection
summary: Представляет собой объемную коллекцию pivotTables. PivotTables сортируются в зависимости от расположения верхнего левого угла pivotTable. Они заказать сверху вниз, а затем слева направо.
remarks: '\[[Набор API: ExcelApi 1.12](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
