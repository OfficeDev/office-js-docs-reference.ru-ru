  uid: excel!Excel.PivotTableScopedCollection#getFirst:member(1)
  package: excel!
  fullName: getFirst()
  summary: Получает первый pivotTable в коллекции. PivotTables в коллекции сортироваться сверху вниз и слева направо, так что верхняя левая таблица является первым pivotTable в коллекции.
