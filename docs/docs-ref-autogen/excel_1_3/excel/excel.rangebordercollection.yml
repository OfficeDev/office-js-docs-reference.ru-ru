methods:
- name: getItem(index)
  uid: excel!Excel.RangeBorderCollection#getItem:member(1)
  package: excel!
  fullName: getItem(index)
  summary: Возвращает объект границы по его имени.
  remarks: >-
    \[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    await Excel.run(async (context) => {
        var sheetName = "Sheet1";
        var rangeAddress = "A1:F8";
        var worksheet = context.workbook.worksheets.getItem(sheetName);
        var range = worksheet.getRange(rangeAddress);
        var border = range.format.borders.getItem(Excel.BorderIndex.edgeTop);
        border.load('style');
        await context.sync();

        console.log(border.style);
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getItem(index: Excel.BorderIndex): Excel.RangeBorder;'
    parameters:
    - id: index
      description: Значение индекса получаемого объекта границы. Подробные `Excel.BorderIndex` сведения см. в материале.
      type: <xref uid="excel!Excel.BorderIndex:enum" />
    return:
      type: <xref uid="excel!Excel.RangeBorder:class" />
      description: ''
