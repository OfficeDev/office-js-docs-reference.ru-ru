methods:
- name: delete()
  uid: powerpoint!PowerPoint.Slide#delete:member(1)
  package: powerpoint!
  fullName: delete()
  summary: Удаляет слайд из презентации. Ничего не делает, если слайд не существует.
  remarks: >-
    \[[Набор API: PowerPointApi 1.2](/office/dev/add-ins/reference/requirement-sets/powerpoint-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/powerpoint/tags/tags.yaml

    await PowerPoint.run(async function(context) {
      const slides = context.presentation.slides;
      slides.load("tags/key, tags/value");

      await context.sync();

      for (let i = 0; i < slides.items.length; i++) {
        let currentSlide = slides.items[i];
        for (let j = 0; j < currentSlide.tags.items.length; j++) {
          let currentTag = currentSlide.tags.items[j];
          if (currentTag.key === "CUSTOMER_TYPE" && currentTag.value === "Premium") {
            currentSlide.delete();
          }
        }
      }

      await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'delete(): void;'
    return:
      type: void
      description: ''
