- name: contentType
  uid: outlook!Office.AttachmentDetails#contentType:member
  package: outlook!
  fullName: contentType
  summary: >-
    Получает тип контента MIME этого вложения.


    **Предупреждение.** Хотя это значение является прямым просмотром расширения вложения, внутреннее сопоставление не поддерживается активно, поэтому это свойство было `contentType` обесценилось. Если требуется определенный тип, захватить расширение и процесс вложения соответственно. Подробные сведения можно найти в [связанном сообщении в блоге.](https://devblogs.microsoft.com/microsoft365dev/outlook-javascript-api-deprecation-for-attachmentdetails-contenttype-property/)<!-- -->.
  remarks: ''
  isPreview: false
  isDeprecated: true
  customDeprecatedMessage: If you require specific content types, grab the attachment's extension and process accordingly.
  syntax:
    content: 'contentType: string;'
    return:
      type: string
