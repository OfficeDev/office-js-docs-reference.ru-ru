- name: emptyCellText
  uid: excel!Excel.Interfaces.PivotLayoutUpdateData#emptyCellText:member
  package: excel!
  fullName: emptyCellText
  summary: Текст, автоматически заполняемый в любую пустую ячейку в PivotTable, если `fillEmptyCells == true`<!-- -->. Обратите внимание, что это значение сохраняется, `fillEmptyCells` если установлено значение `false`<!-- -->и это значение не устанавливает это свойство `true`<!-- -->. По умолчанию это пустая строка.
  remarks: '\[[Набор API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'emptyCellText?: string;'
    return:
      type: string
- name: enableFieldList
