- name: fillEmptyCells
  uid: excel!Excel.Interfaces.PivotLayoutUpdateData#fillEmptyCells:member
  package: excel!
  fullName: fillEmptyCells
  summary: 'Указывает, должны ли пустые ячейки в PivotTable заполняться `emptyCellText`<!-- -->. Значение по умолчанию: `false`<!-- -->. Обратите внимание, что значение `emptyCellText` сохраняется при заданной `false`<!-- -->.'
  remarks: '\[[Набор API: ExcelApi 1.13](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
