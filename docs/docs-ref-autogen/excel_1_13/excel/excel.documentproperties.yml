- name: toJSON()
  uid: excel!Excel.DocumentProperties#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект DocumentProperties — это объект API, метод возвращает обычный `toJSON` объект JavaScript (введите как`Excel.Interfaces.DocumentPropertiesData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
