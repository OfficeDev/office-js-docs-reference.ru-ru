- name: strikethrough
  uid: excel!Excel.RangeFont#strikethrough:member
  package: excel!
  fullName: strikethrough
  summary: Указывает состояние забастовки шрифта. Значение `null` указывает, что весь диапазон не имеет единого параметра strikethrough.
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'strikethrough: boolean;'
    return:
      type: boolean
- name: subscript
  uid: excel!Excel.RangeFont#subscript:member
  package: excel!
  fullName: subscript
  summary: Указывает состояние подписки шрифта. Возвращается `true` , если все шрифты диапазона являются подскриптумом. Возвращается `false` , если все шрифты диапазона являются суперскриптумом или нормальным (ни суперскриптом, ни подскриптом). Возвращает обратное `null` .
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'subscript: boolean;'
    return:
      type: boolean
- name: superscript
  uid: excel!Excel.RangeFont#superscript:member
  package: excel!
  fullName: superscript
  summary: Указывает состояние суперсписка шрифта. Возвращается `true` , если все шрифты диапазона являются суперскриптумом. Возвращается `false` , если все шрифты диапазона являются подскриптумом или нормальным (ни суперскриптом, ни подписком). Возвращает обратное `null` .
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'superscript: boolean;'
    return:
      type: boolean
- name: tintAndShade
  uid: excel!Excel.RangeFont#tintAndShade:member
  package: excel!
  fullName: tintAndShade
  summary: Указывает двойную, которая осветляет или темнеет цвет шрифта диапазона. Значение между -1 (самое темное) и 1 (самое яркое), с 0 для исходного цвета. Значение `null` указывает, что весь диапазон не имеет единого параметра шрифта `tintAndShade` .
  remarks: '\[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'tintAndShade: number;'
    return:
      type: number
