name: Excel.Setting
uid: excel!Excel.Setting:class
package: excel!
fullName: Excel.Setting
summary: Параметр представляет собой пару параметров с значением ключа, сохраняемую в документе (для каждого файла, для надстройки). Эти настраиваемые пары значений ключа можно использовать для хранения сведений о состоянии или жизненном цикле, необходимых надстройке контента или области задач. Обратите внимание, что в документе сохраняются параметры, поэтому хранить конфиденциальные или защищенные сведения, такие как сведения о пользователях и пароль, не место.
remarks: '\[[Набор API: ExcelApi 1.4](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
