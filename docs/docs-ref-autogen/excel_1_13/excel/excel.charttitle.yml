methods:
- name: getSubstring(start, length)
  uid: excel!Excel.ChartTitle#getSubstring:member(1)
  package: excel!
  fullName: getSubstring(start, length)
  summary: Получите подстройку заголовка диаграммы. Разрыв строки '<!-- -->\\<!-- -->n' подсчитываю один символ.
  remarks: >-
    \[[Набор API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/10-chart/chart-title-format.yaml

    await Excel.run(async (context) => {
        let sheet = context.workbook.worksheets.getItem("Sample");
        let chart = sheet.charts.getItemAt(0);

        // Get first seven characters of the title and color them green.
        chart.title.getSubstring(0, 7).font.color = "Yellow";
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'getSubstring(start: number, length: number): Excel.ChartFormatString;'
    parameters:
    - id: start
      description: Начало позиции подстройки, которая должна быть извлечена. Используется нулевой индекс.
      type: number
    - id: length
      description: Длина подстройки, которая должна быть извлечена.
      type: number
    return:
      type: <xref uid="excel!Excel.ChartFormatString:class" />
      description: ''
