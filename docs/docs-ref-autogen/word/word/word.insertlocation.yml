name: Word.InsertLocation
uid: word!Word.InsertLocation:enum
package: word!
fullName: Word.InsertLocation
summary: Типы расположения вставки
remarks: >-
  \[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


  Для использования с вызовом API, `obj.insertSomething(newStuff, location);` например Если расположение "До" или "После", новое содержимое будет за пределами измененного объекта. Если расположение является "Начало" или "Конец", новое содержимое будет включено в состав измененного объекта.
