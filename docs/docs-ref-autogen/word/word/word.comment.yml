- name: content
  uid: word!Word.Comment#content:member
  package: word!
  fullName: content
  summary: Получает или задает содержимое комментария в виде простого текста.
  remarks: >-
    \[[API set: WordApiOnline BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml

    await Word.run(async (context) => {
      let text = $("#edit-comment-text")
        .val()
        .toString();
      let comment = context.document
        .getSelection()
        .getComments()
        .getFirst();
      comment.content = text;

      // Load object for display in Script Lab console.
      context.load(comment);
      await context.sync();

      console.log("Comment content changed:");
      console.log(comment);
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'content: string;'
    return:
      type: string
