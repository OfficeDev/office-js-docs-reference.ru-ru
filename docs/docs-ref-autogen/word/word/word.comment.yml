- name: resolved
  uid: word!Word.Comment#resolved:member
  package: word!
  fullName: resolved
  summary: Получает или задает состояние потока комментариев. Настройка true устраняет поток комментариев. Получение значения true означает, что поток комментариев разрешен.
  remarks: >-
    \[[API set: WordApiOnline BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml

    await Word.run(async (context) => {
      let comment = context.document
        .getSelection()
        .getComments()
        .getFirst();
      comment.load("resolved");
      await context.sync();

      // Toggle resolved status.
      // If the comment is active, set as resolved.
      // If it's resolved, set resolved to false.
      let toggleResolved: boolean = comment.resolved;
      comment.resolved = !toggleResolved;
      context.load(comment);
      await context.sync();

      console.log(`Comment Resolved status: ${comment.resolved}`);
      console.log(comment);
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'resolved: boolean;'
    return:
      type: boolean
