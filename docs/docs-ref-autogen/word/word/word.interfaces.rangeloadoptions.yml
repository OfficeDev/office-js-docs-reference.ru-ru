- name: hyperlink
  uid: word!Word.Interfaces.RangeLoadOptions#hyperlink:member
  package: word!
  fullName: hyperlink
  summary: Возвращает первую гиперссылку в диапазоне или задает для него гиперссылку. При добавлении в диапазон новой гиперссылки из него удаляются все имеющиеся гиперссылки. Используйте \# ', чтобы отделить адресную часть от необязательной части расположения.
  remarks: '\[[Набор API: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
