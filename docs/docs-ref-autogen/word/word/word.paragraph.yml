- name: split(delimiters, trimDelimiters, trimSpacing)
  uid: word!Word.Paragraph#split:member(1)
  package: word!
  fullName: split(delimiters, trimDelimiters, trimSpacing)
  summary: Разделяет абзац на дочерние диапазоны с помощью разделителей.
  remarks: >-
    \[[Набор API: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/35-ranges/split-words-of-first-paragraph.yaml

    await Word.run(async (context) => {
      let paragraph = context.document.body.paragraphs.getFirst();
      let words = paragraph.split([" "], true /* trimDelimiters*/, true /* trimSpaces */);
      words.load("text");

      await context.sync();

      for (let i = 0; i < words.items.length; i++) {
        if (i >= 1) {
          words.items[i - 1].font.highlightColor = "#FFFFFF";
        }
        words.items[i].font.highlightColor = "#FFFF00";

        await context.sync();
        await pause(200);
      }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'split(delimiters: string[], trimDelimiters?: boolean, trimSpacing?: boolean): Word.RangeCollection;'
    parameters:
    - id: delimiters
      description: Обязательно. Делимитеры как массив строк.
      type: string[]
    - id: trimDelimiters
      description: Необязательное свойство. Указывает, следует ли обрезать делимитеры из диапазонов в коллекции диапазона. Значение по умолчанию является ложным, что указывает на то, что делимитеры включены в диапазоны, возвращенные в коллекцию диапазонов.
      type: boolean
    - id: trimSpacing
      description: Необязательное свойство. Указывает, следует ли обрезать интервалы символов (пробелы, вкладки, разрывы столбцов и конечные метки абзаца) с начала и конца диапазона, возвращаемого в коллекции диапазона. Значение по умолчанию является ложным, что указывает на то, что интервалы символов в начале и конце диапазонов включены в коллекцию диапазонов.
      type: boolean
    return:
      type: <xref uid="word!Word.RangeCollection:class" />
      description: ''
- name: startNewList()
  uid: word!Word.Paragraph#startNewList:member(1)
  package: word!
  fullName: startNewList()
  summary: Создает список, начинающийся с данного абзаца. Если абзац уже является элементом списка, метод не выполняется.
  remarks: >-
    \[[Набор API: WordApi 1.3](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/20-lists/insert-list.yaml

    // This example starts a new list stating with the second paragraph.

    await Word.run(async (context) => {
      let paragraphs = context.document.body.paragraphs;
      paragraphs.load("$none"); // No properties needed.

      await context.sync();

      var list = paragraphs.items[1].startNewList(); // Indicates new list to be started in the second paragraph.
      list.load("$none"); // No properties needed.

      await context.sync();

      // To add new items to the list use start/end on the insert location parameter.
      list.insertParagraph("New list item on top of the list", "Start");
      let paragraph = list.insertParagraph("New list item at the end of the list (4th level)", "End");
      paragraph.listItem.level = 4; // Sets up list level for the lsit item.
      // To add paragraphs outside the list use before/after:
      list.insertParagraph("New paragraph goes after (not part of the list)", "After");

      await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'startNewList(): Word.List;'
    return:
      type: <xref uid="word!Word.List:class" />
      description: ''
