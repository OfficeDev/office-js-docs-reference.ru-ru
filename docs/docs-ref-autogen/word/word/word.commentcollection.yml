- name: items
  uid: word!Word.CommentCollection#items:member
  package: word!
  fullName: items
  summary: Получает загруженные дочерние элементы в этой коллекции.
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'readonly items: Word.Comment[];'
    return:
      type: <xref uid="word!Word.Comment:class" />[]
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml\nawait Word.run(async (context) => {\n  let text = $(\"#reply-text\")\n    .val()\n    .toString();\n  let comments = context.document.getSelection().getComments();\n  comments.load(\"items\");\n  await context.sync();\n  let firstActiveComment = comments.items.find((item) => item.resolved !== true);\n  if (firstActiveComment) {\n    let reply = firstActiveComment.reply(text);\n    console.log(\"Reply added\");\n  } else {\n    console.log(\"No active comment was found in the selection so couldn't reply.\");\n  }\n});\n```"
methods:
- name: getFirst()
  uid: word!Word.CommentCollection#getFirst:member(1)
  package: word!
  fullName: getFirst()
  summary: Получает первый комментарий в коллекции. Бросает ошибку, если эта коллекция пуста.
  remarks: >-
    \[[API set: WordApiOnline BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-comments.yaml

    await Word.run(async (context) => {
      let range = context.document
        .getSelection()
        .getComments()
        .getFirst()
        .getRange();
      range.load("text");
      await context.sync();

      console.log(`Comment location: ${range.text}`);
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'getFirst(): Word.Comment;'
    return:
      type: <xref uid="word!Word.Comment:class" />
      description: ''
