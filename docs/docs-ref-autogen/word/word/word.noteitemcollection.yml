  fullName: getFirst()
  summary: Получает первый элемент заметки в этой коллекции. Бросает ошибку, если эта коллекция пуста.
  remarks: >-
    \[[API set: WordApiOnline BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/word/99-preview-apis/manage-footnotes.yaml

    await Word.run(async (context) => {
      let reference = context.document.body.footnotes.getFirst().reference;
      reference.select();
      console.log("The first footnote is selected.");
    });

    ```
