  uid: word!Word.Interfaces.ContentControlData#tag:member
  package: word!
  fullName: tag
  summary: Возвращает или задает тег для определения элемента управления содержимым.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'tag?: string;'
    return:
      type: string
- name: text
  uid: word!Word.Interfaces.ContentControlData#text:member
  package: word!
  fullName: text
  summary: Возвращает текст элемента управления содержимым. Только для чтения.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'text?: string;'
    return:
      type: string
- name: title
  uid: word!Word.Interfaces.ContentControlData#title:member
  package: word!
  fullName: title
  summary: Получает или задает заголовок для элемента управления содержимым.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'title?: string;'
    return:
      type: string
- name: type
  uid: word!Word.Interfaces.ContentControlData#type:member
  package: word!
  fullName: type
  summary: Получает тип элемента управления содержимым. На данный момент поддерживаются только элементы управления содержимым в формате RTF. Только для чтения.
