- name: appearance
  uid: word!Word.Interfaces.ContentControlData#appearance:member
  package: word!
  fullName: appearance
  summary: Получает или задает внешний вид элемента управления содержимым. Значение может быть "BoundingBox", "Tags" или "Hidden".
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'appearance?: Word.ContentControlAppearance | "BoundingBox" | "Tags" | "Hidden";'
    return:
      type: <xref uid="word!Word.ContentControlAppearance:enum" /> | "BoundingBox" | "Tags" | "Hidden"
- name: cannotDelete
  uid: word!Word.Interfaces.ContentControlData#cannotDelete:member
  package: word!
  fullName: cannotDelete
  summary: Возвращает или задает значение, указывающее, может ли пользователь удалить элемент управления содержимым. Является взаимоисключающим со свойством removeWhenEdited.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cannotDelete?: boolean;'
    return:
      type: boolean
- name: cannotEdit
  uid: word!Word.Interfaces.ContentControlData#cannotEdit:member
  package: word!
  fullName: cannotEdit
  summary: Возвращает или задает значение, указывающее, может ли пользователь изменять содержимое элемента управления содержимым.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cannotEdit?: boolean;'
    return:
      type: boolean
- name: color
  uid: word!Word.Interfaces.ContentControlData#color:member
  package: word!
  fullName: color
  summary: Возвращает или задает цвет элемента управления содержимым. Цвет указывается в формате\# RRGGBB или с помощью имени цвета.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'color?: string;'
    return:
      type: string
- name: contentControls
  uid: word!Word.Interfaces.ContentControlData#contentControls:member
  package: word!
  fullName: contentControls
  summary: Получает коллекцию объектов элементов управления содержимым в элементе управления содержимым. Только для чтения.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'contentControls?: Word.Interfaces.ContentControlData[];'
    return:
      type: <xref uid="word!Word.Interfaces.ContentControlData:interface" />[]
- name: font
  uid: word!Word.Interfaces.ContentControlData#font:member
  package: word!
  fullName: font
  summary: Получает текстовый формат элемента управления содержимым. Используйте это свойство для получения и установки имени, размера, цвета и других свойств шрифта. Только для чтения.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'font?: Word.Interfaces.FontData;'
    return:
      type: <xref uid="word!Word.Interfaces.FontData:interface" />
- name: id
  uid: word!Word.Interfaces.ContentControlData#id:member
  package: word!
  fullName: id
  summary: Возвращает целое число, представляющее собой идентификатор элемента управления контентом. Только для чтения.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'id?: number;'
    return:
      type: number
- name: inlinePictures
  uid: word!Word.Interfaces.ContentControlData#inlinePictures:member
  package: word!
  fullName: inlinePictures
  summary: Получает коллекцию объектов inlinePicture в элементе управления содержимым. Коллекция не содержит плавающие рисунки. Только для чтения.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'inlinePictures?: Word.Interfaces.InlinePictureData[];'
    return:
      type: <xref uid="word!Word.Interfaces.InlinePictureData:interface" />[]
- name: paragraphs
  uid: word!Word.Interfaces.ContentControlData#paragraphs:member
  package: word!
  fullName: paragraphs
  summary: Получает коллекцию объектов абзацев в элементе управления содержимым. Только для чтения. **Важно**. Для наборов требований 1.1 и 1.2 абзацы в таблицах, полностью содержащихся в этом элементе управления контентом, не возвращаются. Из набора требований 1.3 возвращаются абзацы в таких таблицах.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'paragraphs?: Word.Interfaces.ParagraphData[];'
    return:
      type: <xref uid="word!Word.Interfaces.ParagraphData:interface" />[]
- name: placeholderText
  uid: word!Word.Interfaces.ContentControlData#placeholderText:member
  package: word!
  fullName: placeholderText
  summary: >-
    Возвращает или задает замещающий текст элемента управления содержимым. Если элемент управления содержимым пуст, отображается затемненный текст.


    **Примечание**. Заданной операции для этого свойства не поддерживается в Word в Интернете.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'placeholderText?: string;'
    return:
      type: string
- name: removeWhenEdited
  uid: word!Word.Interfaces.ContentControlData#removeWhenEdited:member
  package: word!
  fullName: removeWhenEdited
  summary: Возвращает или задает значение, указывающее, удаляется ли элемент управления содержимым после изменения. Является взаимоисключающим со свойством cannotDelete.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'removeWhenEdited?: boolean;'
    return:
      type: boolean
- name: style
  uid: word!Word.Interfaces.ContentControlData#style:member
  package: word!
  fullName: style
  summary: Получает или задает имя стиля для управления контентом. Используйте это свойство для пользовательских стилей и локализованных имен стилей. Чтобы использовать встроенные стили, поддерживающие несколько языковых стандартов, применяйте свойство styleBuiltIn.
  remarks: '\[[Набор API: WordApi 1.1](/office/dev/add-ins/reference/requirement-sets/word-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'style?: string;'
    return:
      type: string
