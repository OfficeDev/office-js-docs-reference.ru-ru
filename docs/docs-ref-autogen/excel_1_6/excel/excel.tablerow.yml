- name: toJSON()
  uid: excel!Excel.TableRow#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный Excel. Объект TableRow — это объект API, `toJSON` метод возвращает обычный объект JavaScript (введите как`Excel.Interfaces.TableRowData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
