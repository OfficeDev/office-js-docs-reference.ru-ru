  summary: Переопределяет метод JavaScript `toJSON()` , чтобы обеспечить более полезный выход, когда объект API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает `toJSON` метод объекта, который передается ему.) В то время как исходный Excel. Объект RangeFill — это объект API, `toJSON` метод возвращает обычный объект JavaScript (введите как`Excel.Interfaces.RangeFillData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
