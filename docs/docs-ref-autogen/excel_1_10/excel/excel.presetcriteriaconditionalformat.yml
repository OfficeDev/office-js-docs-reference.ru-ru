name: Excel.PresetCriteriaConditionalFormat
uid: excel!Excel.PresetCriteriaConditionalFormat:class
package: excel!
fullName: Excel.PresetCriteriaConditionalFormat
summary: Представляет условный формат предустановленных критериев, например, выше среднего, ниже среднего, уникальные значения, содержит пустые, неблагодарные, ошибки и noerror.
remarks: '\[[Набор API: ExcelApi 1.6](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
