### YamlMime:TSType
name: Office.ReplyFormAttachment
uid: outlook!Office.ReplyFormAttachment:interface
package: outlook!
fullName: Office.ReplyFormAttachment
summary: Вложение файла или элемента. Используется при отображение формы ответа.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: inLine
  uid: outlook!Office.ReplyFormAttachment#inLine:member
  package: outlook!
  fullName: inLine
  summary: Используется только в том случае, если для файла установлен тип. Если верно, указывает, что вложение будет отображаться в тексте сообщения и не должно отображаться в списке вложений.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'inLine?: boolean;'
    return:
      type: boolean
- name: itemId
  uid: outlook!Office.ReplyFormAttachment#itemId:member
  package: outlook!
  fullName: itemId
  summary: Используется только в том случае, если тип установлен для элемента. Идентификатор вложения EWS. Это строка длиной до 100 символов.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'itemId?: string;'
    return:
      type: string
- name: name
  uid: outlook!Office.ReplyFormAttachment#name:member
  package: outlook!
  fullName: name
  summary: Строка, содержащая имя вложения, длиной до 255 символов.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'name: string;'
    return:
      type: string
- name: type
  uid: outlook!Office.ReplyFormAttachment#type:member
  package: outlook!
  fullName: type
  summary: Указывает тип вложения. Должен быть файл для вложения файла или элемента для вложения элемента.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: string;'
    return:
      type: string
- name: url
  uid: outlook!Office.ReplyFormAttachment#url:member
  package: outlook!
  fullName: url
  summary: >-
    Используется только в том случае, если для файла установлен тип. Универсальный код ресурса (URI) расположения файла.


    **Важно.** Эта ссылка должна быть общедоступным, без необходимости проверки подлинности Exchange Online серверов. Однако с локальной Exchange связь может быть доступна в частной сети, если она не нуждается в дополнительной проверке подлинности.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'url?: string;'
    return:
      type: string
