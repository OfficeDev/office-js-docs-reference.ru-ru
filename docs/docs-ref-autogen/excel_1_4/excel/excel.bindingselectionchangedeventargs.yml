### YamlMime:TSType
name: Excel.BindingSelectionChangedEventArgs
uid: excel!Excel.BindingSelectionChangedEventArgs:interface
package: excel!
fullName: Excel.BindingSelectionChangedEventArgs
summary: >-
  Предоставляет сведения о выборе, в связи с чем событие выбора изменилось.


  *Примечание**: Если выбрано несколько дисконтных ячеек, для одного выбора будут сообщаться только сведения о строках `Binding.onSelectionChanged` и столбцах. Используйте `Worksheet.onSelectionChanged` для нескольких выбранных диапазонов.
remarks: '\[[Набор API: ExcelApi 1.2](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: interface
