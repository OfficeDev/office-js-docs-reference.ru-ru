- name: $all
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: 'Указание `$all` для LoadOptions загружает все свойства scalar (например: `Range.address`<!-- -->), но не свойства навигации (например: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#address:member
  package: excel!
  fullName: address
  summary: 'Для каждого элемента в коллекции: указывает диапазон, связанный с объектом. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает диапазон.'
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address?: boolean;'
    return:
      type: boolean
- name: isPasswordProtected
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#isPasswordProtected:member
  package: excel!
  fullName: isPasswordProtected
  summary: 'Для каждого элемента в коллекции: указывает, защищен `AllowEditRange` ли пароль.'
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'isPasswordProtected?: boolean;'
    return:
      type: boolean
- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeCollectionLoadOptions#title:member
  package: excel!
  fullName: title
  summary: 'Для каждого элемента в коллекции: указывается заголовок объекта. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает заголовок. Если уже существует существующая с той же строкой или если строка является или пуста (""), то этот метод бросает ошибку и не задает `AllowEditRange` `null` `InvalidArgument` заголовок.'
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title?: boolean;'
    return:
      type: boolean
