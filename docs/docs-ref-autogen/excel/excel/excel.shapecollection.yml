- name: addGroup(values)
  uid: excel!Excel.ShapeCollection#addGroup:member(1)
  package: excel!
  fullName: addGroup(values)
  summary: Группирует подмножество фигур на листе этой коллекции. Возвращает `Shape` объект, который представляет новую группу фигур.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-groups.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Shapes");
        const square = sheet.shapes.getItem("Square");
        const pentagon = sheet.shapes.getItem("Pentagon");
        const octagon = sheet.shapes.getItem("Octagon");

        const shapeGroup = sheet.shapes.addGroup([square, pentagon, octagon]);
        shapeGroup.name = "Group";
        console.log("Shapes grouped");

        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addGroup(values: Array<string | Shape>): Excel.Shape;'
    parameters:
    - id: values
      description: Массив ID или объектов фигуры.
      type: Array&lt;string | <xref uid="excel!Excel.Shape:class" />&gt;
    return:
      type: <xref uid="excel!Excel.Shape:class" />
      description: ''
- name: addImage(base64ImageString)
  uid: excel!Excel.ShapeCollection#addImage:member(1)
  package: excel!
  fullName: addImage(base64ImageString)
  summary: Создает изображение из строки в кодировке base64 и добавляет его на лист. Возвращает `Shape` объект, который представляет новое изображение.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```javascript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-images.yaml

    const myFile = <HTMLInputElement>document.getElementById("selectedFile");

    const reader = new FileReader();


    reader.onload = (event) => {
        Excel.run((context) => {
            const startIndex = reader.result.toString().indexOf("base64,");
            const mybase64 = reader.result.toString().substr(startIndex + 7);
            const sheet = context.workbook.worksheets.getItem("Shapes");
            const image = sheet.shapes.addImage(mybase64);
            image.name = "Image";
            return context.sync();
        });
    };


    // Read in the image file as a data URL.

    reader.readAsDataURL(myFile.files[0]);

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addImage(base64ImageString: string): Excel.Shape;'
    parameters:
    - id: base64ImageString
      description: Строка с кодом base64, представляющая изображение в формате JPEG или PNG.
      type: string
    return:
      type: <xref uid="excel!Excel.Shape:class" />
      description: ''
- name: addLine(startLeft, startTop, endLeft, endTop, connectorType)
  uid: excel!Excel.ShapeCollection#addLine:member(1)
  package: excel!
  fullName: addLine(startLeft, startTop, endLeft, endTop, connectorType)
  summary: Добавляет линию на лист. Возвращает `Shape` объект, который представляет новую строку.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-lines.yaml

    await Excel.run(async (context) => {
        const shapes = context.workbook.worksheets.getItem("Shapes").shapes;
        const line = shapes.addLine(200, 50, 300, 150, Excel.ConnectorType.straight);
        line.name = "StraightLine";
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addLine(startLeft: number, startTop: number, endLeft: number, endTop: number, connectorType?: Excel.ConnectorType): Excel.Shape;'
    parameters:
    - id: startLeft
      description: Расстояние в точках от начала строки до левой стороны таблицы.
      type: number
    - id: startTop
      description: Расстояние в точках от начала строки до верхней части таблицы.
      type: number
    - id: endLeft
      description: Расстояние в точках от конца строки до левой части таблицы.
      type: number
    - id: endTop
      description: Расстояние в точках от конца строки до верхней части таблицы.
      type: number
    - id: connectorType
      description: Представляет тип соединитетеля. Подробные `Excel.ConnectorType` сведения см. в материале.
      type: <xref uid="excel!Excel.ConnectorType:enum" />
    return:
      type: <xref uid="excel!Excel.Shape:class" />
      description: ''
