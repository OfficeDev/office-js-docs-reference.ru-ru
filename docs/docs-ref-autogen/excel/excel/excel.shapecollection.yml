- name: addGeometricShape(geometricShapeType)
  uid: excel!Excel.ShapeCollection#addGeometricShape:member(1)
  package: excel!
  fullName: addGeometricShape(geometricShapeType)
  summary: Добавляет геометрическую фигуру на лист. Возвращает `Shape` объект, который представляет новую фигуру.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/44-shape/shape-create-and-delete.yaml

    await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem("Shapes");
        const shape = sheet.shapes.addGeometricShape(Excel.GeometricShapeType.hexagon);
        shape.left = 5;
        shape.top = 5;
        shape.height = 175;
        shape.width = 200;
        await context.sync();
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addGeometricShape(geometricShapeType: Excel.GeometricShapeType): Excel.Shape;'
    parameters:
    - id: geometricShapeType
      description: Представляет тип геометрической фигуры. Подробные `Excel.GeometricShapeType` сведения см. в материале.
      type: <xref uid="excel!Excel.GeometricShapeType:enum" />
    return:
      type: <xref uid="excel!Excel.Shape:class" />
      description: ''
