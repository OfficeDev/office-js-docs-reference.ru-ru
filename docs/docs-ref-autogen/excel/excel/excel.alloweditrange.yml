- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRange#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Приостановка защиты таблиц для данного `AllowEditRange` объекта для пользователя в заданном сеансе. Этот метод приостанавлитовка защиты объекта только в том случае, если она включена и `AllowEditRange` не приостановлена. Если защита таблицы не может быть приостановлена, этот метод бросает ошибку и не приостанавлиет защиту `UnsupportedOperation` для диапазона. Если пароль неверен, этот метод бросает ошибку и не может приостановить защиту `InvalidArgument` диапазона.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
