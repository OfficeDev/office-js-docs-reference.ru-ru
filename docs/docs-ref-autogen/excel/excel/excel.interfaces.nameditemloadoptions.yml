  uid: excel!Excel.Interfaces.NamedItemLoadOptions#value:member
  package: excel!
  fullName: value
  summary: Представляет значение, вычисленное по формуле имени. Если задан именованный диапазон, возвращается адрес диапазона.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
