- name: scope
  uid: excel!Excel.Interfaces.NamedItemLoadOptions#scope:member
  package: excel!
  fullName: scope
  summary: 'Указывает, задано ли имя в книге или в определенной таблице. Возможные значения: таблица, книга.'
