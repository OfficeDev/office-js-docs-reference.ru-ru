  summary: Формула названного элемента. Формулы всегда начинаются с равного знака ("=").
  remarks: '\[[Набор API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
