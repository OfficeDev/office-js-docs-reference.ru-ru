- name: text
  uid: excel!Excel.Interfaces.RangeViewLoadOptions#text:member
  package: excel!
  fullName: text
  summary: Текстовые значения указанного диапазона. Текстовое значение не зависит от ширины ячейки. Замена \# знака, которая Excel пользовательском интерфейсе, не повлияет на текстовое значение, возвращаемую API.
  remarks: '\[[Набор API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
