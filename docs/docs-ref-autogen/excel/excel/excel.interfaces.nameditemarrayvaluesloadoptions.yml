  fullName: valuesAsJsonLocal
  summary: Представление JSON значений в этом массиве элементов с именем. В отличие от `NamedItemArrayValues.values`<!-- -->поддерживает `NamedItemArrayValues.valuesAsJsonLocal` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным отображением пользователя. Чтобы получить данные независимо от локального, используйте `NamedItemArrayValues.valuesAsJson`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
