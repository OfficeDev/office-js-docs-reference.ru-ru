- name: valuesAsJson
  uid: excel!Excel.Interfaces.NamedItemArrayValuesLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Представление JSON значений в этом массиве элементов с именем. В отличие от `NamedItemArrayValues.values`<!-- -->поддерживает `NamedItemArrayValues.valuesAsJson` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным кодом en-US. Чтобы получить данные в локальном дисплее пользователя, используйте `NamedItemArrayValues.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
