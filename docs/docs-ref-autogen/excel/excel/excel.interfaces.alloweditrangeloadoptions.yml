### YamlMime:TSType
name: Excel.Interfaces.AllowEditRangeLoadOptions
uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions:interface
package: excel!
fullName: Excel.Interfaces.AllowEditRangeLoadOptions
summary: Представляет `AllowEditRange` объект, найденный в таблице. Этот объект работает со свойствами защиты от таблицы. Когда включена защита от таблицы, объект можно использовать для редактирования определенного диапазона, сохраняя защиту на остальной части `AllowEditRange` таблицы.
remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: $all
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#$all:member
  package: excel!
  fullName: $all
  summary: 'Указание `$all` для LoadOptions загружает все свойства scalar (например: `Range.address`<!-- -->), но не свойства навигации (например: `Range.format.fill.color`<!-- -->).'
  remarks: ''
  isPreview: true
  isDeprecated: false
  syntax:
    content: '$all?: boolean;'
    return:
      type: boolean
- name: address
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#address:member
  package: excel!
  fullName: address
  summary: Указывает диапазон, связанный с объектом. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает диапазон.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'address?: boolean;'
    return:
      type: boolean
- name: isPasswordProtected
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#isPasswordProtected:member
  package: excel!
  fullName: isPasswordProtected
  summary: Указывает, защищен `AllowEditRange` ли пароль.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'isPasswordProtected?: boolean;'
    return:
      type: boolean
- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#title:member
  package: excel!
  fullName: title
  summary: Указывает название объекта. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает заголовок. Если уже существует существующая с той же строкой или если строка является или пуста (""), то этот метод бросает ошибку и не задает `AllowEditRange` `null` `InvalidArgument` заголовок.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'title?: boolean;'
    return:
      type: boolean
