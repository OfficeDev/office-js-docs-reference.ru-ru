- name: title
  uid: excel!Excel.Interfaces.AllowEditRangeLoadOptions#title:member
  package: excel!
  fullName: title
  summary: Указывает название объекта. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает заголовок. Если уже существует существующая с той же строкой или если строка является или пуста (""), то этот метод бросает ошибку и не задает `AllowEditRange` `null` `InvalidArgument` заголовок.
