  package: excel!
  fullName: address
  summary: Указывает диапазон, связанный с объектом. Чтобы этот метод работал должным образом, необходимо отключить или приостановить защиту таблицы. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` задает диапазон.
