### YamlMime:TSType
name: Excel.CellValueProviderAttributes
uid: excel!Excel.CellValueProviderAttributes:interface
package: excel!
fullName: Excel.CellValueProviderAttributes
summary: >-
  Объект атрибутов поставщика представляет набор сведений, используемых в представлении карт для предоставления заданных сведений о брендинге для типа, который поддерживает `CellValue` атрибуты поставщика.


  \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: description
  uid: excel!Excel.CellValueProviderAttributes#description:member
  package: excel!
  fullName: description
  summary: >-
    Представляет свойство описания поставщика, используемое в представлении карты, если не указан логотип. Если задан логотип, он будет использоваться в качестве текста tooltip.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'description?: string;'
    return:
      type: string
- name: logoSourceAddress
  uid: excel!Excel.CellValueProviderAttributes#logoSourceAddress:member
  package: excel!
  fullName: logoSourceAddress
  summary: >-
    Представляет URL-адрес, используемый для загрузки изображения, которое будет использоваться в качестве логотипа в представлении карты.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'logoSourceAddress?: string;'
    return:
      type: string
- name: logoTargetAddress
  uid: excel!Excel.CellValueProviderAttributes#logoTargetAddress:member
  package: excel!
  fullName: logoTargetAddress
  summary: >-
    Представляет URL-адрес, который является объектом навигации, если пользователь щелкает элементом логотипа в представлении карты.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
