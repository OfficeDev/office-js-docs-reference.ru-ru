  value: "\"TooManyCells\""
- name: unknown
  uid: excel!Excel.CalcErrorCellValueSubType.unknown:member
  package: excel!
  summary: Неизвестный тип ошибки. Отображает как тип \# ошибки CALC! в Excel.
  value: "\"Unknown\""
- name: unsupportedLifting
  uid: excel!Excel.CalcErrorCellValueSubType.unsupportedLifting:member
  package: excel!
  summary: Ошибка, вызванная попыткой снять неподтверченную формулу (например Динамический UDF) над массивом. Отображает как тип \# ошибки CALC! в Excel.
