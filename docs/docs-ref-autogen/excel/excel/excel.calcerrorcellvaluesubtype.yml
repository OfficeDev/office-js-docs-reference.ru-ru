fields:
- name: arrayOfArrays
  uid: excel!Excel.CalcErrorCellValueSubType.arrayOfArrays:member
  package: excel!
  summary: Ошибка, вызванная в том числе массивом в массиве. Отображает как тип \# ошибки CALC! в Excel.
  value: "\"ArrayOfArrays\""
- name: arrayOfRanges
  uid: excel!Excel.CalcErrorCellValueSubType.arrayOfRanges:member
  package: excel!
