  value: "\"ArrayOfRanges\""
- name: dataTableReferencedPendingFormula
  uid: excel!Excel.CalcErrorCellValueSubType.dataTableReferencedPendingFormula:member
  package: excel!
  summary: Ошибка, вызванная таблицей данных, ссылаясь на ожидаемую формулу. Ожидаемая формула, скорее всего, асинхронна. Отображает как тип \# ошибки CALC! в Excel.
  value: "\"DataTableReferencedPendingFormula\""
- name: emptyArray
  uid: excel!Excel.CalcErrorCellValueSubType.emptyArray:member
