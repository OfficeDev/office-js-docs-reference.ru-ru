- name: valueAsJson
  uid: excel!Excel.Interfaces.NamedItemData#valueAsJson:member
  package: excel!
  fullName: valueAsJson
  summary: Представление JSON значений в этом элементе с именем. В отличие от `NamedItem.value`<!-- -->поддерживает `NamedItem.valueAsJson` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным кодом en-US. Чтобы получить данные в локальном дисплее пользователя, используйте `NamedItem.valueAsJsonLocal`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJson?: CellValue;'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />
- name: valueAsJsonLocal
  uid: excel!Excel.Interfaces.NamedItemData#valueAsJsonLocal:member
  package: excel!
  fullName: valueAsJsonLocal
  summary: Представление JSON значений в этом элементе с именем. В отличие от `NamedItem.value`<!-- -->поддерживает `NamedItem.valueAsJsonLocal` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным отображением пользователя. Чтобы получить данные независимо от локального, используйте `NamedItem.valueAsJson`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valueAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
