- name: pauseProtection(password)
  uid: excel!Excel.AllowEditRangeCollection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Приостановка защиты от таблиц для всех объектов в коллекции с заданным паролем `AllowEditRange` для пользователя в заданном сеансе. Этот метод приостановит защиту объектов только в том случае, если включена и не приостановлена защита `AllowEditRange` таблицы. Если защита таблицы не может быть приостановлена, этот метод бросает ошибку и не приостанавлиет защиту `UnsupportedOperation` для диапазона. Если пароль не совпадает с объектами в коллекции, этот метод бросает ошибку и не приостанавлиет защиту для любого `AllowEditRange` `BadPassword` диапазона в коллекции.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password: string): void;'
    parameters:
    - id: password
      description: Пароль для приостановки защиты `AllowEditRange` объектов.
      type: string
    return:
      type: void
      description: ''
