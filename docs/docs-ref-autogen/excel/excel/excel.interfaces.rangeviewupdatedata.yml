name: Excel.Interfaces.RangeViewUpdateData
uid: excel!Excel.Interfaces.RangeViewUpdateData:interface
package: excel!
fullName: Excel.Interfaces.RangeViewUpdateData
summary: Интерфейс для обновления данных объекта RangeView для использования в `rangeView.set({ ... })`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: formulas
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulas:member
  package: excel!
  fullName: formulas
  summary: Представляет формулу в формате A1. Если ячейка не имеет формулы, вместо нее возвращается ее значение.
  remarks: '\[[Набор API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulas?: any[][];'
    return:
      type: any[][]
- name: formulasLocal
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulasLocal:member
  package: excel!
  fullName: formulasLocal
  summary: Представляет формулу в нотации стиля A1 на языке пользователя и в соответствии с его языковым стандартом. Например, английская формула =SUM(A1, 1.5) превратится в "=СУММ(A1; 1,5)" на русском языке. Если ячейка не имеет формулы, вместо нее возвращается ее значение.
  remarks: '\[[Набор API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasLocal?: any[][];'
    return:
      type: any[][]
- name: formulasR1C1
  uid: excel!Excel.Interfaces.RangeViewUpdateData#formulasR1C1:member
  package: excel!
  fullName: formulasR1C1
  summary: Представляет формулу в формате R1C1. Если ячейка не имеет формулы, вместо нее возвращается ее значение.
  remarks: '\[[Набор API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasR1C1?: any[][];'
    return:
      type: any[][]
- name: numberFormat
  uid: excel!Excel.Interfaces.RangeViewUpdateData#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: Представляет код в числовом формате Excel для данной ячейки.
