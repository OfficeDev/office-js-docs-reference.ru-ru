    content: 'numberFormat?: any[][];'
    return:
      type: any[][]
- name: values
  uid: excel!Excel.Interfaces.RangeViewUpdateData#values:member
  package: excel!
  fullName: values
  summary: Представляет необработанные значения указанного объекта rangeView. Могут возвращаться строковые и числовые данные, а также логические значения. Ячейки, содержащие ошибку, вернут строку ошибки.
  remarks: '\[[Набор API: ExcelApi 1.3](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.RangeViewUpdateData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Представление JSON значений в ячейках этого диапазона. В отличие от `RangeView.values`<!-- -->поддерживает `RangeView.valuesAsJson` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным кодом en-US. Чтобы получить данные в локальном дисплее пользователя, используйте `RangeView.valuesAsJsonLocal`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.RangeViewUpdateData#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: Представление JSON значений в ячейках этого диапазона. В отличие от `RangeView.values`<!-- -->поддерживает `RangeView.valuesAsJsonLocal` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным отображением пользователя. Чтобы получить данные независимо от локального, используйте `RangeView.valuesAsJson`<!-- -->.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
