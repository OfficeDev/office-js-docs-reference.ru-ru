### YamlMime:TSType
name: Excel.WorksheetMovedEventArgs
uid: excel!Excel.WorksheetMovedEventArgs:interface
package: excel!
fullName: Excel.WorksheetMovedEventArgs
summary: >-
  Нотифицирует, когда таблица перемещается в книге.


  Если таблица перемещается из одной позиции в книге в другую Excel пользовательского интерфейса, этот API запускает событие. Обратите внимание, что если положение таблицы изменяется в результате перемещения другого таблицы, это событие не будет вызывать изменения обеих позиций. Это событие вызывает только движение основного таблицы, а не изменения положения таблицы, которые происходят в результате этого основного перемещения.
remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
