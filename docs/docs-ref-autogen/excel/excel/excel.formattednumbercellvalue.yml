### YamlMime:TSType
name: Excel.FormattedNumberCellValue
uid: excel!Excel.FormattedNumberCellValue:interface
package: excel!
fullName: Excel.FormattedNumberCellValue
summary: Представляет значение ячейки, содержащей номер со строкой формата. Строки формата номеров должны соответствовать Excel рекомендациям. Дополнительные новости см. в [руководстве по обзору для настройки формата номеров](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->. В этом сценарии формат применяется к значению, а не к ячейке, поэтому значение сохраняет свою строку формата во время вычисления.
remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
properties:
- name: basicType
  uid: excel!Excel.FormattedNumberCellValue#basicType:member
  package: excel!
  fullName: basicType
  summary: Представляет значение, которое будет возвращено ячейкой `Range.valueTypes` с этим значением.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicType?: RangeValueType.double | "Double";'
    return:
      type: <xref uid="excel!Excel.RangeValueType.double:member" /> | "Double"
- name: basicValue
  uid: excel!Excel.FormattedNumberCellValue#basicValue:member
  package: excel!
  fullName: basicValue
  summary: Представляет значение, которое будет возвращено ячейкой `Range.values` с этим значением.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicValue: number;'
    return:
      type: number
- name: numberFormat
  uid: excel!Excel.FormattedNumberCellValue#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: Возвращает строку формата номеров, которая используется для отображения этого значения. При доступе через свойство `valuesAsJson` эта строка формата номеров находится в локальном коде en-US. При доступе через свойство `valuesAsJsonLocal` этот формат номеров находится в локальном расположении отображения пользователя. Строки формата номеров должны соответствовать Excel рекомендациям. Дополнительные новости см. в [руководстве по обзору для настройки формата номеров](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->.
  remarks: >-
    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/85-preview-apis/data-types-formatted-number.yaml

    await Excel.run(async (context) => {
      // This method creates a formatted number data type,
      // and sets the format of this data type as a currency.

      // Get the Sample worksheet and a range on that sheet.
      const sheet = context.workbook.worksheets.getItemOrNullObject("Sample");
      const currencyRange = sheet.getRange("A2");

      // Write a number formatted as currency to cell A2.
      currencyRange.valuesAsJson = [
        [
          {
            type: Excel.CellValueType.formattedNumber,
            basicValue: 12.34,
            numberFormat: "$* #,##0.00"
          }
        ]
      ];

      await context.sync();
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'numberFormat: string;'
    return:
      type: string
- name: type
  uid: excel!Excel.FormattedNumberCellValue#type:member
  package: excel!
  fullName: type
  summary: Представляет тип этого значения ячейки.
  remarks: >-
    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/85-preview-apis/data-types-formatted-number.yaml

    await Excel.run(async (context) => {
      // This method creates a formatted number data type,
      // and sets the format of this data type as a date.

      // Get the Sample worksheet and a range on that sheet.
      const sheet = context.workbook.worksheets.getItemOrNullObject("Sample");
      const dateRange = sheet.getRange("A1");

      // Write a number formatted as a date to cell A1.
      dateRange.valuesAsJson = [
        [
          {
            type: Excel.CellValueType.formattedNumber,
            basicValue: 32889.0,
            numberFormat: "m/d/yyyy"
          }
        ]
      ];
      await context.sync();
    });

    ```
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'type: CellValueType.formattedNumber | "FormattedNumber";'
    return:
      type: <xref uid="excel!Excel.CellValueType.formattedNumber:member" /> | "FormattedNumber"
