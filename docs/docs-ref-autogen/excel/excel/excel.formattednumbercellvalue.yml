### YamlMime:TSType
name: Excel.FormattedNumberCellValue
uid: excel!Excel.FormattedNumberCellValue:interface
package: excel!
fullName: Excel.FormattedNumberCellValue
summary: >-
  Представляет значение ячейки, содержащей номер со строкой формата. Строки формата номеров должны соответствовать Excel рекомендациям. Дополнительные новости см. в [руководстве по обзору для настройки формата номеров](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->. В этом сценарии формат применяется к значению, а не к ячейке, поэтому значение сохраняет свою строку формата во время вычисления.


  \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: numberFormat
  uid: excel!Excel.FormattedNumberCellValue#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: >-
    Возвращает строку формата номеров, которая используется для отображения этого значения. Строки формата номеров должны соответствовать Excel рекомендациям. Дополнительные новости см. в [руководстве по обзору для настройки формата номеров](https://support.microsoft.com/office/review-guidelines-for-customizing-a-number-format-c0a1d1fa-d3f4-4018-96b7-9c9354dd99f5)<!-- -->.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'numberFormat: string;'
    return:
      type: string
- name: primitive
  uid: excel!Excel.FormattedNumberCellValue#primitive:member
  package: excel!
  fullName: primitive
  summary: >-
    Представляет значение, которое будет возвращено ячейкой `Range.values` с этим значением.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'primitive: number;'
    return:
      type: number
- name: primitiveType
  uid: excel!Excel.FormattedNumberCellValue#primitiveType:member
  package: excel!
  fullName: primitiveType
  summary: >-
    Представляет значение, которое будет возвращено ячейкой `Range.valueTypes` с этим значением.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'primitiveType: RangeValueType.double | "Double";'
    return:
      type: <xref uid="excel!Excel.RangeValueType.double:member" /> | "Double"
- name: type
  uid: excel!Excel.FormattedNumberCellValue#type:member
  package: excel!
  fullName: type
  summary: >-
    Представляет тип этого значения ячейки.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'type: CellValueType.formattedNumber | "FormattedNumber";'
    return:
      type: <xref uid="excel!Excel.CellValueType.formattedNumber:member" /> | "FormattedNumber"
