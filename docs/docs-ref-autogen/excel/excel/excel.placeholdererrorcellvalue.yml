  uid: excel!Excel.PlaceholderErrorCellValue#basicType:member
  package: excel!
  fullName: basicType
  summary: Представляет значение, которое будет возвращено ячейкой `Range.valueTypes` с этим значением.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicType?: RangeValueType.error | "Error";'
    return:
      type: <xref uid="excel!Excel.RangeValueType.error:member" /> | "Error"
- name: basicValue
  uid: excel!Excel.PlaceholderErrorCellValue#basicValue:member
  package: excel!
  fullName: basicValue
  summary: Представляет значение, которое будет возвращено ячейкой `Range.values` с этим значением. При доступе через свойство `valuesAsJson` это значение строки совпадает с локальным кодом en-US. При доступе через свойство `valuesAsJsonLocal` это значение строки совпадает с локальным отображением пользователя.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'basicValue?: "#BUSY!" | string;'
    return:
      type: "\"#BUSY!\" | string"
