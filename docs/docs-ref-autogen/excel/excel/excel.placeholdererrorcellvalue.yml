name: Excel.PlaceholderErrorCellValue
uid: excel!Excel.PlaceholderErrorCellValue:interface
package: excel!
fullName: Excel.PlaceholderErrorCellValue
summary: Представляет значение ячейки, содержащей busy \#! ошибка. Этот тип ошибки используется в качестве местообнамерщика при загрузке значения ячейки.
remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
