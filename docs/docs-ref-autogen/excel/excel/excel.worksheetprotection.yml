- name: pauseProtection(password)
  uid: excel!Excel.WorksheetProtection#pauseProtection:member(1)
  package: excel!
  fullName: pauseProtection(password)
  summary: Приостановка защиты таблиц для данного объекта таблицы для пользователя в заданном сеансе. Если пароль неправильный, этот метод бросает ошибку `UnsupportedOperation` и не может приостановить защиту. Этот метод не меняет состояние защиты, если защита таблицы не включена или уже приостановлена.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'pauseProtection(password?: string): void;'
    parameters:
    - id: password
      description: Пароль, связанный с защищенным таблицой.
      type: string
    return:
      type: void
      description: ''
- name: protect(options, password)
  uid: excel!Excel.WorksheetProtection#protect:member(1)
  package: excel!
  fullName: protect(options, password)
  summary: Защищает лист. Сбой, если таблица уже защищена.
  remarks: >-
    \[[API set: ExcelApi 1.2 for options; 1.7 for password](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/data-protection.yaml

    await Excel.run(async (context) => {
        let activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("protection/protected");

        await context.sync();

        if (!activeSheet.protection.protected) {
            activeSheet.protection.protect();
        }
    });

    ```

    ```typescript

    // Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/50-workbook/data-protection.yaml

    let password = await passwordHandler();

    passwordHelper(password);

    await Excel.run(async (context) => {
        let activeSheet = context.workbook.worksheets.getActiveWorksheet();
        activeSheet.load("protection/protected");

        await context.sync();

        if (!activeSheet.protection.protected) {
            activeSheet.protection.protect(null, password);
        }
    });

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'protect(options?: Excel.WorksheetProtectionOptions, password?: string): void;'
    parameters:
    - id: options
      description: Необязательно. Параметры защиты листа.
      type: <xref uid="excel!Excel.WorksheetProtectionOptions:interface" />
    - id: password
      description: Необязательно. Пароль защиты листа.
      type: string
    return:
      type: void
      description: ''
