- name: setPassword(password)
  uid: excel!Excel.WorksheetProtection#setPassword:member(1)
  package: excel!
  fullName: setPassword(password)
  summary: Изменяет пароль, связанный с `WorksheetProtection` объектом. Установка пароля в качестве пустой строки ("") или как `null` удаляет защиту паролей от `WorksheetProtection` объекта. Чтобы этот метод работал правильно, необходимо включить и приостановить защиту таблицы. Если защита таблиц отключена, этот метод бросает ошибку и `InvalidOperation` не меняет пароль. Если защита таблиц включена и не приостановлена, этот метод бросает ошибку и не `AccessDenied` меняет пароль.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'setPassword(password?: string): void;'
    parameters:
    - id: password
      description: Пароль, связанный с `WorksheetProtection` объектом.
      type: string
    return:
      type: void
      description: ''
- name: toJSON()
  uid: excel!Excel.WorksheetProtection#toJSON:member(1)
  package: excel!
  fullName: toJSON()
  summary: Переопределяет метод JavaScript, чтобы обеспечить более полезный выход, когда объект `toJSON()` API передается `JSON.stringify()`<!-- -->. (`JSON.stringify`<!-- -->, в свою очередь, вызывает метод объекта, который `toJSON` передается ему.) В то время как исходный Excel. Объект WorksheetProtection — это объект API, метод возвращает простой `toJSON` объект JavaScript (введите как`Excel.Interfaces.WorksheetProtectionData`<!-- -->), содержащий неглубокие копии любых загруженных свойств ребенка из исходного объекта.
  remarks: ''
