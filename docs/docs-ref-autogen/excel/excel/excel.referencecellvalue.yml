### YamlMime:TSType
name: Excel.ReferenceCellValue
uid: excel!Excel.ReferenceCellValue:interface
package: excel!
fullName: Excel.ReferenceCellValue
summary: Представляет ссылку на `referencedValues`<!-- -->. Один из сценариев использования этой ссылки — избежать дублирования объектов значения ячейки (например, `EntityCellValue`<!-- -->). Определение объекта значения ячейки после `referencedValues`<!-- -->, а затем обратитесь к этому значению ячейки из многих мест, `ReferenceCellValue` используя место, где появилось бы дублирующее значение.
remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: true
isDeprecated: false
type: interface
