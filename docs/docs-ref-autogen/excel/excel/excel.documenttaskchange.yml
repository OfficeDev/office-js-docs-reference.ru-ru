  fullName: priority
  summary: Представляет приоритет задачи. Используется для типа `setPriority` записи изменений. Это значение между 0 и 10, при этом 5 является приоритетом по умолчанию, если не установлено, и где 0 представляет наивысший приоритет.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
