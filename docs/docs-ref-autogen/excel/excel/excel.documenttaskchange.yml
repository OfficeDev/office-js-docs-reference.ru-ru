- name: percentComplete
  uid: excel!Excel.DocumentTaskChange#percentComplete:member
  package: excel!
  fullName: percentComplete
  summary: Представляет процент выполнения задачи. Используется для типа `setPercentComplete` записи изменений. Это значение от 0 до 100, где 100 представляет завершенную задачу. Изменение этого значения до 100 также завершает связанный комментарий. Изменение завершения со 100 на более низкое значение активирует связанный комментарий.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
