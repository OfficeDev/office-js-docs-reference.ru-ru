properties:
- name: index
  uid: excel!Excel.Interfaces.TableRowData#index:member
  package: excel!
  fullName: index
  summary: Возвращает номер индекса строки в коллекции строк таблицы. Используется нулевой индекс.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'index?: number;'
    return:
      type: number
- name: values
  uid: excel!Excel.Interfaces.TableRowData#values:member
  package: excel!
  fullName: values
  summary: Представляет необработанные значения указанного диапазона. Возвращенные данные могут быть строкой, номером или boolean. Ячейки, содержащие ошибку, вернут строку ошибки. Если возвращенное значение начинается с плюса ("+"), минуса ("-"), или равного знака ("="), Excel интерпретирует это значение как формулу.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableRowData#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: Представление JSON значений в ячейках в этой строке таблицы. В отличие от `TableRow.values`<!-- -->поддерживает `TableRow.valuesAsJson` все типы данных, которые могут быть в ячейке.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: CellValue[][];'
    return:
      type: <xref uid="excel!Excel.CellValue:type" />[][]
