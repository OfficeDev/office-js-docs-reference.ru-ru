- name: values
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#values:member
  package: excel!
  fullName: values
  summary: 'Для каждого элемента в коллекции: представляет необработанные значения указанного диапазона. Возвращенные данные могут быть строкой, номером или boolean. Ячейки, содержащие ошибку, вернут строку ошибки. Если возвращенное значение начинается с плюса ("+"), минуса ("-" или равного знака ("="), Excel интерпретирует это значение как формулу.'
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: boolean;'
    return:
      type: boolean
- name: valuesAsJson
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#valuesAsJson:member
  package: excel!
  fullName: valuesAsJson
  summary: 'Для каждого элемента в коллекции: представление JSON значений в ячейках в этом столбце таблицы. В отличие от `TableColumn.values`<!-- -->поддерживает `TableColumn.valuesAsJson` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным кодом en-US. Чтобы получить данные в локальном дисплее пользователя, используйте `TableColumn.valuesAsJsonLocal`<!-- -->.'
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJson?: boolean;'
    return:
      type: boolean
- name: valuesAsJsonLocal
  uid: excel!Excel.Interfaces.TableColumnCollectionLoadOptions#valuesAsJsonLocal:member
  package: excel!
  fullName: valuesAsJsonLocal
  summary: 'Для каждого элемента в коллекции: представление JSON значений в ячейках в этом столбце таблицы. В отличие от `TableColumn.values`<!-- -->поддерживает `TableColumn.valuesAsJsonLocal` все типы данных, которые могут быть в ячейке. Примеры включают отформатированные значения номеров и веб-изображения, в дополнение к стандартным значениям boolean, number и string. Данные, возвращаемые из этого API, всегда совпадают с локальным отображением пользователя. Чтобы получить данные независимо от локального, используйте `TableColumn.valuesAsJson`<!-- -->.'
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'valuesAsJsonLocal?: boolean;'
    return:
      type: boolean
