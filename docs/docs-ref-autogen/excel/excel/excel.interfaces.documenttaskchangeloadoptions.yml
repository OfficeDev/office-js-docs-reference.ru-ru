- name: dueDateTime
  uid: excel!Excel.Interfaces.DocumentTaskChangeLoadOptions#dueDateTime:member
  package: excel!
  fullName: dueDateTime
  summary: Представляет дату и время задачи в часовом поясе UTC. Используется для типа `setSchedule` записи изменений. Можно установить для `null` удаления даты и времени. Его следует настроить вместе, `startDateTime` чтобы избежать конфликтов.
