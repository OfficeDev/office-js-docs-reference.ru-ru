  package: excel!
  fullName: startDateTime
  summary: Представляет дату и время начала задачи в часовом поясе UTC. Используется для типа `setSchedule` записи изменений. Можно установить, `null` чтобы удалить дату и время начала. Его следует настроить вместе, `dueDateTime` чтобы избежать конфликтов.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'startDateTime?: boolean;'
    return:
      type: boolean
