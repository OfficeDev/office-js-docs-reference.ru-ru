- name: percentComplete
  uid: excel!Excel.Interfaces.DocumentTaskChangeLoadOptions#percentComplete:member
  package: excel!
  fullName: percentComplete
  summary: Представляет процент выполнения задачи. Используется для типа `setPercentComplete` записи изменений. Это значение от 0 до 100, где 100 представляет завершенную задачу. Изменение этого значения до 100 также завершает связанный комментарий. Изменение завершения со 100 на более низкое значение активирует связанный комментарий.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'percentComplete?: boolean;'
    return:
      type: boolean
- name: priority
  uid: excel!Excel.Interfaces.DocumentTaskChangeLoadOptions#priority:member
  package: excel!
  fullName: priority
  summary: Представляет приоритет задачи. Используется для типа `setPriority` записи изменений. Это значение между 0 и 10, при этом 5 является приоритетом по умолчанию, если не установлено, и где 0 представляет наивысший приоритет.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
  syntax:
