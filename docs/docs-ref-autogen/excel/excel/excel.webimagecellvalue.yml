  fullName: address
  summary: Представляет URL-адрес, с которого будет загружено изображение. Это изображение должно быть организовано на сервере, который поддерживает HTTPS.
  remarks: '\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: true
  isDeprecated: false
