name: Excel.WebImageCellValue
uid: excel!Excel.WebImageCellValue:interface
package: excel!
fullName: Excel.WebImageCellValue
summary: >-
  Представляет значение ячейки, содержащей изображение, скачаное из Интернета.


  \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.WebImageCellValue#address:member
  package: excel!
  fullName: address
  summary: >-
    Представляет URL-адрес, с которого будет загружено изображение. Это изображение должно быть организовано на сервере, который поддерживает HTTPS.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address: string;'
    return:
      type: string
- name: altText
  uid: excel!Excel.WebImageCellValue#altText:member
  package: excel!
  fullName: altText
  summary: >-
    Представляет альтернативный текст, который можно использовать в сценариях доступности для описания изображения.


