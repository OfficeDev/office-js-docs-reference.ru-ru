- name: attribution
  uid: excel!Excel.WebImageCellValue#attribution:member
  package: excel!
  fullName: attribution
  summary: >-
    Представляет сведения о присвоении для описания исходных и лицензионных требований для использования этого изображения.


    \[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]
