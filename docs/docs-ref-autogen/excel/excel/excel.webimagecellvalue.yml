- name: type
  uid: excel!Excel.WebImageCellValue#type:member
  package: excel!
  fullName: type
  summary: Представляет тип этого значения ячейки.
  remarks: "\\[[API set: ExcelApi BETA (PREVIEW ONLY)](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \\]\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Link to full sample: https://raw.githubusercontent.com/OfficeDev/office-js-snippets/prod/samples/excel/85-preview-apis/data-types-web-image.yaml\nawait Excel.run(async (context) => {\n  // This method inserts a web image into the currently selected cell.\n\n  // Retrieve image data from the task pane and then clear the input fields.\n  const imageUrl = $(\"#url\").val() as string;\n  const imageAltText = $(\"#alt-text\").val() as string;\n  clearForm();\n\n  // Load the active cell.\n  const activeCell = context.workbook.getActiveCell();\n  activeCell.load();\n  await context.sync();\n\n  if (!imageUrl) {\n    console.log(\"Please enter an image URL.\");\n    return;\n  }\n\n  // Create a web image object and assign the image details.\n  const webImage: Excel.WebImageCellValue = {\n    type: \"WebImage\", /* The string equivalent of `Excel.CellValueType.webImage`. */\n    address: imageUrl,\n    altText: imageAltText     \n  };\n\n  // Insert web image into the active cell.\n  activeCell.valuesAsJson = [[webImage]];\n\n  await context.sync();\n});\n```"
  isPreview: true
  isDeprecated: false
  syntax:
    content: 'тип: CellValueType.webImage | "WebImage";'
    return:
      type: <xref uid="excel!Excel.CellValueType.webImage:member" /> | "WebImage"
