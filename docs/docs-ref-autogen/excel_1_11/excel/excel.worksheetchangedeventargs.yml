- name: changeType
  uid: excel!Excel.WorksheetChangedEventArgs#changeType:member
  package: excel!
  fullName: changeType
  summary: Получает тип изменений, который представляет, как запускается измененное событие. Подробные `Excel.DataChangeType` сведения см. в материале.
  remarks: '\[[Набор API: ExcelApi 1.7](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'changeType: Excel.DataChangeType | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted";'
    return:
      type: <xref uid="excel!Excel.DataChangeType:enum" /> | "Unknown" | "RangeEdited" | "RowInserted" | "RowDeleted" | "ColumnInserted" | "ColumnDeleted" | "CellInserted" | "CellDeleted"
- name: details
  uid: excel!Excel.WorksheetChangedEventArgs#details:member
  package: excel!
  fullName: details
  summary: Представляет сведения об изменениях. Это свойство может быть извлечено при запуске измененного события в одной ячейке. Если измененное событие запускается на нескольких ячейках, это свойство невозможно получить.
  remarks: >-
    \[[Набор API: ExcelApi 1.9](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]


    #### <a name="examples"></a>Примеры


    ```typescript

    // This function would be used as an event handler for the Worksheet.onChanged event.

    async function onWorksheetChanged(eventArgs) {
        await Excel.run(async (context) => {
            var details = eventArgs.details;
            var address = eventArgs.address;

            // Print the before and after types and values to the console.
            console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
                + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);
            await context.sync();
        });
    }

    ```
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'details: Excel.ChangedEventDetail;'
    return:
      type: <xref uid="excel!Excel.ChangedEventDetail:interface" />
