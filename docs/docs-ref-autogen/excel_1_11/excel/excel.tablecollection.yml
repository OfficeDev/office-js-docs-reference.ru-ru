name: Excel.TableCollection
uid: excel!Excel.TableCollection:class
package: excel!
fullName: Excel.TableCollection
summary: Представляет коллекцию всех таблиц, входящих в состав книги или листа, в зависимости от способа доступа.
remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
isPreview: false
isDeprecated: false
type: class
