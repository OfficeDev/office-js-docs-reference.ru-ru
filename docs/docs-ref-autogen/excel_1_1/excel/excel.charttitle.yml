- name: load(propertyNames)
  uid: excel!Excel.ChartTitle#load:member(2)
  package: excel!
  fullName: load(propertyNames)
  summary: Добавляет в очередь команду для загрузки указанных свойств объекта. Перед чтением свойств требуется вызвать метод `context.sync()`.
  remarks: ''
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'load(propertyNames?: string | string[]): Excel.ChartTitle;'
    parameters:
    - id: propertyNames
      description: Запятая или массив строк, которые указывают свойства для загрузки.
      type: string | string[]
    return:
      type: <xref uid="excel!Excel.ChartTitle:class" />
      description: "\n\n#### <a name=\"examples\"></a>Примеры\n\n```typescript\n// Set the text of the chart title to \"My Chart\" and display it as an overlay on the chart.\nawait Excel.run(async (context) => { \n    var chart = context.workbook.worksheets.getItem(\"Sheet1\").charts.getItem(\"Chart1\");    \n    \n    chart.title.text= \"My Chart\"; \n    chart.title.visible=true;\n    chart.title.overlay=true;\n    \n    await context.sync();\n    console.log(\"Char Title Changed\");\n});\n```"
