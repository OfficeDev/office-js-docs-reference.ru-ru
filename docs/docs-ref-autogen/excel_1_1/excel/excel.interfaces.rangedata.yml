### YamlMime:TSType
name: Excel.Interfaces.RangeData
uid: excel!Excel.Interfaces.RangeData:interface
package: excel!
fullName: Excel.Interfaces.RangeData
summary: Интерфейс, описывающий данные, возвращаемые по вызову `range.toJSON()`<!-- -->.
remarks: ''
isPreview: false
isDeprecated: false
type: interface
properties:
- name: address
  uid: excel!Excel.Interfaces.RangeData#address:member
  package: excel!
  fullName: address
  summary: Указывает ссылку диапазона в стиле A1. Значение адреса содержит ссылку на лист (например, "Sheet1! A1:B4").
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'address?: string;'
    return:
      type: string
- name: addressLocal
  uid: excel!Excel.Interfaces.RangeData#addressLocal:member
  package: excel!
  fullName: addressLocal
  summary: Представляет ссылку диапазона для указанного диапазона на языке пользователя.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'addressLocal?: string;'
    return:
      type: string
- name: cellCount
  uid: excel!Excel.Interfaces.RangeData#cellCount:member
  package: excel!
  fullName: cellCount
  summary: Указывает количество ячеек в диапазоне. Этот API возвращает значение -1, если количество ячеек превышает 2^31-1 (2,147,483,647).
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'cellCount?: number;'
    return:
      type: number
- name: columnCount
  uid: excel!Excel.Interfaces.RangeData#columnCount:member
  package: excel!
  fullName: columnCount
  summary: Указывает общее количество столбцов в диапазоне.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'columnCount?: number;'
    return:
      type: number
- name: columnIndex
  uid: excel!Excel.Interfaces.RangeData#columnIndex:member
  package: excel!
  fullName: columnIndex
  summary: Указывает номер столбца первой ячейки в диапазоне. Используется нулевой индекс.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'columnIndex?: number;'
    return:
      type: number
- name: format
  uid: excel!Excel.Interfaces.RangeData#format:member
  package: excel!
  fullName: format
  summary: Возвращает объект формата, в который включены шрифт, заливка, границы, выравнивание и другие свойства диапазона.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'format?: Excel.Interfaces.RangeFormatData;'
    return:
      type: <xref uid="excel!Excel.Interfaces.RangeFormatData:interface" />
- name: formulas
  uid: excel!Excel.Interfaces.RangeData#formulas:member
  package: excel!
  fullName: formulas
  summary: Представляет формулу в формате A1. Если ячейка не имеет формулы, вместо нее возвращается ее значение.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulas?: any[][];'
    return:
      type: any[][]
- name: formulasLocal
  uid: excel!Excel.Interfaces.RangeData#formulasLocal:member
  package: excel!
  fullName: formulasLocal
  summary: Представляет формулу в нотации стиля A1 на языке пользователя и в соответствии с его языковым стандартом. Например, английская формула =SUM(A1, 1.5) превратится в "=СУММ(A1; 1,5)" на русском языке. Если ячейка не имеет формулы, вместо нее возвращается ее значение.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'formulasLocal?: any[][];'
    return:
      type: any[][]
- name: numberFormat
  uid: excel!Excel.Interfaces.RangeData#numberFormat:member
  package: excel!
  fullName: numberFormat
  summary: Представляет Excel формата номеров для данного диапазона.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'numberFormat?: any[][];'
    return:
      type: any[][]
- name: rowCount
  uid: excel!Excel.Interfaces.RangeData#rowCount:member
  package: excel!
  fullName: rowCount
  summary: Возвращает общее количество строк в диапазоне.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'rowCount?: number;'
    return:
      type: number
- name: rowIndex
  uid: excel!Excel.Interfaces.RangeData#rowIndex:member
  package: excel!
  fullName: rowIndex
  summary: Возвращает номер строки первой ячейки диапазона. Используется нулевой индекс.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'rowIndex?: number;'
    return:
      type: number
- name: text
  uid: excel!Excel.Interfaces.RangeData#text:member
  package: excel!
  fullName: text
  summary: Текстовые значения указанного диапазона. Текстовое значение не зависит от ширины ячейки. Замена знака номера () в пользовательском интерфейсе Excel не повлияет на текстовое значение, возвращаемого \# API.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'text?: string[][];'
    return:
      type: string[][]
- name: values
  uid: excel!Excel.Interfaces.RangeData#values:member
  package: excel!
  fullName: values
  summary: Представляет необработанные значения указанного диапазона. Возвращенные данные могут быть строкой, номером или boolean. Ячейки, содержащие ошибку, вернут строку ошибки. Если возвращенное значение начинается с плюса ("+"), минуса ("-"), или равного знака ("="), Excel интерпретирует это значение как формулу.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'values?: any[][];'
    return:
      type: any[][]
- name: valueTypes
  uid: excel!Excel.Interfaces.RangeData#valueTypes:member
  package: excel!
  fullName: valueTypes
  summary: Указывает тип данных в каждой ячейке.
  remarks: '\[[Набор API: ExcelApi 1.1](/office/dev/add-ins/reference/requirement-sets/excel-api-requirement-sets) \]'
  isPreview: false
  isDeprecated: false
  syntax:
    content: 'valueTypes?: Excel.RangeValueType[][];'
    return:
      type: <xref uid="excel!Excel.RangeValueType:enum" />[][]
